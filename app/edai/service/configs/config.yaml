server:
  http:
    # D4：V1.0 仅本机访问。改成 0.0.0.0 等于对局域网开放，需先补齐 P6 的
    # Origin/Host 校验与传输安全。
    addr: 127.0.0.1:8200
    timeout: 60s
    enable_swagger: true
    enable_pprof: false
    cors:
      headers:
        - "X-Requested-With"
        - "Content-Type"
        - "Authorization"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      # 仅允许本机 Dashboard 来源；不要改成 "*"
      origins:
        - "http://127.0.0.1:8200"
        - "http://localhost:8200"
        - "http://127.0.0.1:5173"
        - "http://localhost:5173"
    middleware:
      limiter:
        name: "bbr"
      enable_logging: true
      enable_recovery: true
      enable_validate: true
      auth:
        method: "HS256"
        # 必须通过 EDAI_JWT_KEY 覆盖；此值仅用于本机开发。
        # 生产/客户环境使用固定口令会导致任意本机进程可伪造令牌。
        key: "dev-only-change-before-production-32-bytes"
        expires_time: 604800s
  grpc:
    addr: 127.0.0.1:9200
    timeout: 1s
    middleware:
      limiter:
        name: "bbr"
      enable_logging: true
      enable_recovery: true
      enable_validate: true
data:
  database:
    # D5：SQLite + WAL。库文件放在 EDAI 数据目录下，便于整体备份与迁移。
    # 注意 DSN 中的缓存/锁参数，并发扫描时避免 database is locked。
    driver: sqlite
    source: "file:./data/edai.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)"
    migrate: false
    debug: false
