[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funasr-server"
version = "0.1.0"
description = "工程化的 FunASR 语音识别 HTTP 服务：批量识别（SenseVoice）+ 流式识别（paraformer-zh-streaming）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["asr", "funasr", "speech-recognition", "sensevoice", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# 运行时依赖。funasr 依赖较重（torch 等），可通过环境变量或镜像选择版本。
dependencies = [
    "funasr>=1.2.0",
    "modelscope>=1.18.0",
    "numpy>=1.24",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
funasr-server = "funasr_server.cli:main"

[tool.setuptools.packages.find]
include = ["funasr_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
