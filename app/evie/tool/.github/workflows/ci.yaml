# GitHub Actions CI for evie/tool.
#
# Note: This file is placed under the subdirectory rather than the repo root.
# Move it to backend-service/.github/workflows/ci.yaml when consolidating the
# sub-repo's CI; the commands are identical.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-service/app/evie/tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: gofmt
        run: |
          out=$(gofmt -l internal pkg cmd)
          if [ -n "$out" ]; then echo "gofmt diff: $out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: test (race)
        run: go test -race ./...

      - name: bench
        run: go test -bench=. -run=^$ -benchtime=1x ./internal/biz/ ./internal/biz/processor/ || true

      - name: govulncheck
        # 依赖漏洞扫描（source mode = 仅 reachable vuln）。
        #
        # 退出码：0=无漏洞，3=发现漏洞 → 本步会硬阻断 PR。
        # 前置条件：
        #   - setup-go 使用 Go 1.25 latest（>= 1.25.13）以获得 stdlib 补丁
        #   - google.golang.org/grpc >= 1.82.1、golang.org/x/net >= 0.55.0（已升级）
        #
        # 本步不再使用 continue-on-error：发现任何 reachable vuln 都会让 PR 失败。
        # 报告作为 artifact 上传（保留 30 天）供人工审查。
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -mode=source -show=verbose ./... > govulncheck.txt 2>&1
          rc=$?
          echo "govulncheck exit code: $rc"
          if [ $rc -ne 0 ]; then
            echo "::error::govulncheck 发现 reachable 漏洞，PR 被阻断"
            tail -120 govulncheck.txt
            exit $rc
          fi
          echo "✓ 无 reachable 漏洞"

      - name: upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: govulncheck.txt
          if-no-files-found: ignore
          retention-days: 30
