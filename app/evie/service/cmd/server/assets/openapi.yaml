tags:
    - name: ASRService
      description: |-
        ASR 语音识别服务。
         将音频转为文本；Provider（FunASR/Whisper/讯飞/阿里云）可替换、租户可自选。
    - name: DictionaryService
      description: |-
        词库中心：词库（Dictionary）与词条（DictionaryEntry）管理服务。
         词库表示一组具有共同作用域和生命周期的语言知识集合；
         词条表示一个标准语言概念（词或短语）。
    - name: EnhancementService
      description: |-
        文本增强策略与场景管理服务。
         策略决定增强引擎执行哪些层；场景绑定策略供业务按需选择。
    - name: ProviderService
      description: ASR 供应商配置管理服务。
