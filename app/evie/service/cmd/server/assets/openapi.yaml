    /admin/v1/menus:
        get:
            tags:
                - MenuService
                - 菜单管理服务
            summary: 获取菜单列表
            description: 获取菜单列表
            operationId: MenuService_ListMenus
            parameters:
                - name: page_token
                  in: query
                  description: 当前页码
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 每页的行数
                  schema:
                    type: integer
                    format: int32
                - name: nopaging
                  in: query
                  description: 是否不分页
                  schema:
                    type: boolean
                - name: name
                  in: query
                  description: 菜单名称
                  schema:
                    type: string
                - name: status
                  in: query
                  description: 菜单状态
                  schema:
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_ENABLED
                        - STATUS_DISABLED
                    type: string
                    format: enum
                - name: filter
                  in: query
                  description: |-
                    Optional. The standard list filter.
                     Supported fields:
                        * `name` (i.e. `name="John Doe"`)
                        * `email` (i.e. `email="admin@go-kratos.dev"`)
                        * `phone` (i.e. `phone="+1234567890"`)
                        * `create_time` range (i.e. `timestamp>="2025-01-31T11:30:00-04:00"` where
                        the timestamp is in RFC 3339 format)

                     More detail in [AIP-160](https://google.aip.dev/160).
                  schema:
                    type: string
                - name: orderBy
                  in: query
                  description: |-
                    Optional. A comma-separated list of fields to order by, sorted in ascending
                     order. Use "desc" after a field name for descending. Supported fields:
                     - `create_time`

                     Example: `create_time desc`.
                  schema:
                    type: string
                - name: skip
                  in: query
                  description: |-
                    * A request with no page token and a skip value of 30 returns a single
                       page of results starting with the 31st result.
                     * A request with a page token corresponding to the 51st result (because the
                       first 50 results were returned on the first page) and a skip value of 30
                       returns a single page of results starting with the 81st result.
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMenusResponse'
            security:
                - BearerAuth: []
        post:
            tags:
                - MenuService
                - 菜单管理服务
            summary: 创建菜单
            description: 创建菜单
            operationId: MenuService_CreateMenu
            parameters:
                - name: operatorId
                  in: query
                  schema:
                    type: integer
                    format: uint32
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Menu'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateMenuResponse'
            security:
                - BearerAuth: []
