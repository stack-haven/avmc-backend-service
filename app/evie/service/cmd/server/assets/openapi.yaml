            type: object
            properties:
                encoding:
                    enum:
                        - AUDIO_ENCODING_UNSPECIFIED
                        - AUDIO_ENCODING_PCM
                        - AUDIO_ENCODING_WAV
                        - AUDIO_ENCODING_MP3
                        - AUDIO_ENCODING_OPUS
                    type: string
                    format: enum
                sampleRate:
                    type: integer
                    format: int32
                bitDepth:
                    type: integer
                    format: int32
                channels:
                    type: integer
                    format: int32
            description: AudioFormat 音频格式。
        CreateCategoryRequest:
            type: object
            properties:
                code:
                    type: string
                name:
                    type: string
                sort:
                    type: integer
                    format: int32
        CreateDictionaryRequest:
            type: object
            properties:
                name:
                    type: string
                scope:
                    type: string
                source:
                    type: string
                description:
                    type: string
        CreateEntryRequest:
            type: object
            properties:
                dictionaryId:
                    type: integer
                    format: uint32
                standardText:
                    type: string
                entryType:
                    type: string
                category:
                    type: string
                description:
                    type: string
                source:
                    type: string
                sourceId:
                    type: string
                priority:
                    type: integer
                    format: int32
                pinyin:
                    type: string
                pinyinInitial:
                    type: string
                normalizedText:
                    type: string
