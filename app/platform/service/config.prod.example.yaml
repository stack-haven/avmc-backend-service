# Login protection is configured with:
# platform_ADMIN_LOGIN_MAX_ATTEMPTS=5
# platform_ADMIN_LOGIN_WINDOW=15m
# platform_ADMIN_LOGIN_LOCKOUT=15m
server:
  http:
    addr: 0.0.0.0:8000
    timeout: 3s
    enable_swagger: false
    cors:
      headers:
        - "X-Requested-With"
        - "Content-Type"
        - "Authorization"
      methods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "HEAD"
        - "OPTIONS"
      origins:
        - "https://admin.example.com"
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_validate: true
      enable_circuit_breaker: true
      auth:
        method: "HS256"
        key: "replace-with-platform_ADMIN_JWT_KEY"
        expires_time: 2h
  grpc:
    addr: 0.0.0.0:9000
    timeout: 3s
    middleware:
      enable_logging: true
      enable_recovery: true
      enable_validate: true
      enable_circuit_breaker: true
data:
  database:
    driver: mysql
    source: replace-with-platform_ADMIN_DB_SOURCE
    migrate: false
    debug: false
    max_idle_connections: 10
    max_open_connections: 50
    connection_max_lifetime: 1800s
  redis:
    addr: replace-with-platform_ADMIN_REDIS_ADDR
    password: replace-with-platform_ADMIN_REDIS_PASSWORD
    db: 0
    dial_timeout: 1s
    read_timeout: 0.5s
    write_timeout: 0.5s
