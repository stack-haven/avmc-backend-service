name: Backend CI

on:
  push:
    # coding/ai 是 origin/HEAD 默认分支。此前只监听 main/master/ark-tech，
    # 导致默认分支上的 154 个提交从未被执行过任何 CI（见 docs/platform/README.md）。
    branches:
      - coding/ai
      - main
      - master
      - ark-tech
  pull_request:
    branches:
      - coding/ai
      - main
      - master
      - ark-tech
  workflow_dispatch:
    inputs:
      strict_coverage:
        description: "Run coverage with FAIL_ON_GAP=1 (CI gate mode)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 backend-service/Makefile 的 *_VERSION 保持一致
  BUF_VERSION: "1.64.0"
  GOLANGCI_LINT_VERSION: "v1.64.8"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # lint-new 需要基准分支，浅克隆拿不到 origin/coding/ai
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # 由 make check 统一调用，这里只负责安装
          install-only: true

      - name: Install pinned codegen toolchain
        run: make setup-tools

      - name: Run quality gate
        env:
          # lint-new 的增量基准：PR 用目标分支，push 用 origin/coding/ai
          LINT_BASE: origin/${{ github.base_ref || 'coding/ai' }}
        run: make check

      - name: Verify generated files
        run: make generate-check

      - name: Verify import boundaries (service → biz → data)
        run: make import-boundary-check

      - name: Verify HTTP path convention (AIP-136)
        run: make http-convention-check

      - name: Run focused race detection
        run: make race

  coverage:
    # 覆盖率报告：默认仅上传 report（不阻断）；workflow_dispatch 可手动开启严格模式
    # 严格模式触发条件：workflow_dispatch.strict_coverage == 'true'
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run coverage
        env:
          # CI 默认报告模式；workflow_dispatch 触发且开启 strict 才 FAIL_ON_GAP=1
          FAIL_ON_GAP: ${{ github.event.inputs.strict_coverage == 'true' && '1' || '0' }}
        run: ./scripts/check-coverage.sh

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: backend-service/bin/coverage/coverage-summary.txt
          if-no-files-found: warn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - ./app/platform/service/cmd/server
          - ./app/ai/service/cmd/server
          - ./app/evie/service/cmd/server
          - ./app/edai/service/cmd/server
          - ./app/version/service/cmd/server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build service image
        run: docker build --build-arg SERVICE_PACKAGE=${{ matrix.service }} .
