syntax = "proto3";

package avmc.ai.v1;

import "errors/errors.proto";

option go_package = "backend-service/api/avmc/ai/v1;v1";
option java_multiple_files = true;
option java_package = "dev.kratos.avmc.ai.v1";
option objc_class_prefix = "RESOURCEapiV1";

// 错误原因枚举，定义系统中可能出现的各种错误情况
enum ErrorReason {
  // 设置缺省错误码为500
  option (errors.default_code) = 500;

  // =======================================
  // Chat服务错误 (1200-1299)
  // =======================================
  // 未找到指定的AI对话记录
  CHAT_NOT_FOUND = 0 [(errors.code) = 404];
  // AI对话不存在于系统中
  CHAT_NOT_EXIST = 1 [(errors.code) = 404];
  // 提供的AI对话ID无效，可能格式错误或不存在
  CHAT_INVALID_ID = 2 [(errors.code) = 400];
  // AI对话状态不能为空
  CHAT_STATUS_CANNOT_BE_EMPTY = 3 [(errors.code) = 400];
}
