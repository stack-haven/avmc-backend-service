syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";

option go_package = "backend-service/api/core/service/v1;v1";

enum ParameterValueType {
  PARAMETER_VALUE_TYPE_UNSPECIFIED = 0;
  PARAMETER_VALUE_TYPE_STRING = 1;
  PARAMETER_VALUE_TYPE_INTEGER = 2;
  PARAMETER_VALUE_TYPE_BOOLEAN = 3;
  PARAMETER_VALUE_TYPE_JSON = 4;
}

enum ParameterValueSource {
  PARAMETER_VALUE_SOURCE_UNSPECIFIED = 0;
  PARAMETER_VALUE_SOURCE_PLATFORM_DEFAULT = 1;
  PARAMETER_VALUE_SOURCE_TENANT_OVERRIDE = 2;
}

message ParameterDefinition {
  uint32 id = 1;
  string key = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 100
    pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9_-]*)+$"
  }];
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  ParameterValueType value_type = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string default_value = 5 [(buf.validate.field).string.max_len = 16384];
  optional string description = 6 [(buf.validate.field).string.max_len = 500];
  bool tenant_overridable = 7;
  optional enum.Status status = 8 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional int32 sort = 9 [(buf.validate.field).int32 = {gte: 0, lte: 9999}];
  optional string created_at = 10;
  optional string updated_at = 11;
}

message ResolvedParameter {
  uint32 definition_id = 1;
  string key = 2;
  string name = 3;
  ParameterValueType value_type = 4;
  string value = 5;
  ParameterValueSource source = 6;
  bool tenant_overridable = 7;
  optional string description = 8;
  optional string updated_at = 9;
}

message ListParameterDefinitionsRequest {
  string page_token = 1;
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  optional string key = 3 [(buf.validate.field).string.max_len = 100];
  optional string name = 4 [(buf.validate.field).string.max_len = 100];
  optional ParameterValueType value_type = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional enum.Status status = 6 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message ListParameterDefinitionsResponse {
  repeated ParameterDefinition items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetParameterDefinitionRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}
message GetParameterDefinitionResponse {
  ParameterDefinition parameter = 1;
}

message CreateParameterDefinitionRequest {
  ParameterDefinition parameter = 1 [(buf.validate.field).required = true];
}
message CreateParameterDefinitionResponse {
  ParameterDefinition parameter = 1;
}

message UpdateParameterDefinitionRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  ParameterDefinition parameter = 2 [(buf.validate.field).required = true];
}
message UpdateParameterDefinitionResponse {
  ParameterDefinition parameter = 1;
}

message DeleteParameterDefinitionRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}
message DeleteParameterDefinitionResponse {}

message ListCurrentTenantParametersRequest {
  optional string key = 1 [(buf.validate.field).string.max_len = 100];
}

message ListTenantParametersRequest {
  uint32 tenant_id = 1 [(buf.validate.field).uint32.gt = 0];
  optional string key = 2 [(buf.validate.field).string.max_len = 100];
}

message ListCurrentTenantParametersResponse {
  repeated ResolvedParameter items = 1;
}

message SetCurrentTenantParameterRequest {
  string key = 1 [(buf.validate.field).string = {min_len: 3, max_len: 100}];
  string value = 2 [(buf.validate.field).string.max_len = 16384];
}
message SetCurrentTenantParameterResponse {
  ResolvedParameter parameter = 1;
}

message SetTenantParameterRequest {
  uint32 tenant_id = 1 [(buf.validate.field).uint32.gt = 0];
  string key = 2 [(buf.validate.field).string = {min_len: 3, max_len: 100}];
  string value = 3 [(buf.validate.field).string.max_len = 16384];
}
message SetTenantParameterResponse {
  ResolvedParameter parameter = 1;
}

message ResetCurrentTenantParameterRequest {
  string key = 1 [(buf.validate.field).string = {min_len: 3, max_len: 100}];
}
message ResetCurrentTenantParameterResponse {}

message ResetTenantParameterRequest {
  uint32 tenant_id = 1 [(buf.validate.field).uint32.gt = 0];
  string key = 2 [(buf.validate.field).string = {min_len: 3, max_len: 100}];
}
message ResetTenantParameterResponse {}

message ListTenantParametersResponse {
  repeated ResolvedParameter items = 1;
}
