syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";

option go_package = "backend-service/api/core/service/v1;v1";
option java_multiple_files = true;
option java_package = "core.service.v1";

service FileCenterService {
  rpc CreateFileUploadSession(CreateFileUploadSessionRequest) returns (CreateFileUploadSessionResponse);
  rpc UploadFileContent(UploadFileContentRequest) returns (UploadFileContentResponse);
  rpc ConfirmFileUpload(ConfirmFileUploadRequest) returns (ConfirmFileUploadResponse);
  rpc GetFileObject(GetFileObjectRequest) returns (FileObject);
  rpc ListFileObjects(ListFileObjectsRequest) returns (ListFileObjectsResponse);
  rpc PresignFileDownload(PresignFileDownloadRequest) returns (PresignFileDownloadResponse);
  rpc DeleteFileObject(DeleteFileObjectRequest) returns (DeleteFileObjectResponse);
}

message FileObject {
  uint32 id = 1;
  optional uint32 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}];
  optional string file_name = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    },
    (gnostic.openapi.v3.property) = {description: "原始文件名"}
  ];
  optional string content_type = 4 [
    (buf.validate.field).string.max_len = 120,
    (gnostic.openapi.v3.property) = {description: "文件 MIME 类型"}
  ];
  optional int64 size = 5 [
    (buf.validate.field).int64.gte = 0,
    (gnostic.openapi.v3.property) = {description: "文件大小，单位字节"}
  ];
  optional string sha256 = 6 [
    (buf.validate.field).string.max_len = 64,
    (gnostic.openapi.v3.property) = {description: "文件 SHA256"}
  ];
  optional string provider = 7 [(gnostic.openapi.v3.property) = {description: "存储渠道"}];
  optional string bucket = 8 [(gnostic.openapi.v3.property) = {description: "存储桶"}];
  optional string object_key = 9 [(gnostic.openapi.v3.property) = {description: "对象 Key"}];
  optional string business_type = 10 [(gnostic.openapi.v3.property) = {description: "业务类型"}];
  optional string business_id = 11 [(gnostic.openapi.v3.property) = {description: "业务ID"}];
  optional string visibility = 12 [(gnostic.openapi.v3.property) = {description: "可见性 private/public"}];
  optional int32 status = 13 [(gnostic.openapi.v3.property) = {description: "状态 1 待确认 2 已确认 3 已删除"}];
  optional uint32 created_by = 14 [(gnostic.openapi.v3.property) = {description: "创建人ID"}];
  optional string created_at = 15 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional string updated_at = 16 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional string deleted_at = 17 [(gnostic.openapi.v3.property) = {description: "删除时间"}];
  optional string upload_expires_at = 18 [(gnostic.openapi.v3.property) = {description: "上传凭证过期时间"}];
  optional uint32 provider_id = 19 [(gnostic.openapi.v3.property) = {description: "存储渠道ID"}];
  optional string provider_code = 20 [(gnostic.openapi.v3.property) = {description: "存储渠道编码"}];
}

message CreateFileUploadSessionRequest {
  optional string file_name = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    },
    (gnostic.openapi.v3.property) = {description: "原始文件名"}
  ];
  optional string content_type = 2 [(buf.validate.field).string.max_len = 120];
  optional int64 size = 3 [(buf.validate.field).int64.gte = 0];
  optional string sha256 = 4 [(buf.validate.field).string.max_len = 64];
  optional string business_type = 5 [(buf.validate.field).string.max_len = 80];
  optional string business_id = 6 [(buf.validate.field).string.max_len = 120];
  optional string visibility = 7 [(buf.validate.field).string.max_len = 20];
  optional string idempotency_key = 8 [(buf.validate.field).string.max_len = 120];
}

message CreateFileUploadSessionResponse {
  FileObject file = 1;
  string upload_url = 2;
  string upload_method = 3;
  string expires_at = 4;
}

message UploadFileContentRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  bytes content = 2 [(gnostic.openapi.v3.property) = {description: "文件内容"}];
  optional string content_type = 3 [(buf.validate.field).string.max_len = 120];
  optional string sha256 = 4 [(buf.validate.field).string.max_len = 64];
}

message UploadFileContentResponse {
  FileObject file = 1;
}

message ConfirmFileUploadRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional int64 size = 2 [(buf.validate.field).int64.gte = 0];
  optional string sha256 = 3 [(buf.validate.field).string.max_len = 64];
  optional string etag = 4 [(buf.validate.field).string.max_len = 120];
}

message ConfirmFileUploadResponse {
  FileObject file = 1;
}

message GetFileObjectRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message ListFileObjectsRequest {
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 10}
    }
  ];
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  optional string file_name = 4 [(buf.validate.field).string.max_len = 255];
  optional string business_type = 5 [(buf.validate.field).string.max_len = 80];
  optional string business_id = 6 [(buf.validate.field).string.max_len = 120];
  optional int32 status = 7;
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}];
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

message ListFileObjectsResponse {
  repeated FileObject items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message PresignFileDownloadRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional int32 expires_seconds = 2 [(buf.validate.field).int32.gte = 0];
}

message PresignFileDownloadResponse {
  string download_url = 1;
  string expires_at = 2;
}

message DeleteFileObjectRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional string idempotency_key = 2 [(buf.validate.field).string.max_len = 120];
}

message DeleteFileObjectResponse {}
