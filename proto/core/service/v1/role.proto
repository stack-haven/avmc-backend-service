syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "common/pagination/pagination.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "backend-service/api/core/service/v1;v1";

service RoleService {
  // 创建角色
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  // 更新角色
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  // 删除角色
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
  // 获取角色
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  // 分页查询角色
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  // 判断角色名是否存在
  rpc ExistRoleByName(ExistRoleByNameRequest) returns (ExistRoleByNameResponse);
  // 更新角色状态
  rpc UpdateRoleByStatus(UpdateRoleByStatusRequest) returns (UpdateRoleByStatusResponse);
}

// 角色信息
message Role {
  // 角色ID
  uint32 id = 1;
  // 角色名称
  optional string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 20
    },
    (gnostic.openapi.v3.property) = {description: "角色名称"}
  ];
  // 角色状态 0 未知 1 启用 2 禁用
  optional enum.Status status = 3 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {
      description: "角色状态 0 未知 1 启用 2 禁用"
      default: {number: 1}
    }
  ];
  // 排序字段
  optional int32 sort = 4 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    },
    (gnostic.openapi.v3.property) = {
      description: "排序字段"
      default: {number: 10}
    }
  ];
  // 角色描述
  optional string remark = 5 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "角色描述"}
  ];
  // 默认路由
  optional string default_router = 6 [
    (buf.validate.field).string = {
      uri_ref: true
      min_len: 1
      max_len: 200
    },
    (gnostic.openapi.v3.property) = {description: "默认路由"}
  ];
  // 菜单树选择项是否关联显示
  optional int32 menu_check_strictly = 7 [(gnostic.openapi.v3.property) = {
    description: "菜单树选择项是否关联显示"
    default: {number: 1}
  }];
  // 部门树选择项是否关联显示
  optional int32 dept_check_strictly = 8 [(gnostic.openapi.v3.property) = {
    description: "部门树选择项是否关联显示"
    default: {number: 1}
  }];
  // 数据范围
  optional int32 data_scope = 9 [(gnostic.openapi.v3.property) = {
    description: "数据范围：1全部 2本人 3本部门 4本部门及下级 5自定义部门"
    default: {number: 2}
  }];
  // 创建时间
  optional string created_at = 10 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  optional string updated_at = 11 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 角色绑定的菜单ID列表
  repeated uint32 menu_ids = 12 [(gnostic.openapi.v3.property) = {description: "角色绑定的菜单ID列表"}];
  bool is_tenant_admin = 13 [(gnostic.openapi.v3.property) = {description: "是否租户管理员角色，只读"}];
  repeated uint32 dept_ids = 14 [(gnostic.openapi.v3.property) = {description: "自定义数据范围部门ID列表"}];
}

// 创建角色请求
message CreateRoleRequest {
  Role role = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "角色信息"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 创建角色响应
message CreateRoleResponse {}

// 更新角色请求
message UpdateRoleRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "角色ID"}
  ];
  Role role = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "角色信息"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
  // Required. Mask of fields to update.
  google.protobuf.FieldMask update_mask = 4 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "更新字段掩码"}
  ];
}

// 更新角色响应
message UpdateRoleResponse {}

// 删除角色请求
message DeleteRoleRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "角色ID"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 删除角色响应
message DeleteRoleResponse {}

// 获取角色请求
message GetRoleRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "角色ID"}
  ];
}

// 获取角色响应
message GetRoleResponse {
  Role role = 1;
}

// 分页查询角色请求
message ListRolesRequest {
  // 当前页码
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  // 每页的行数
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 10}
    }
  ];
  // 是否不分页
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  // 角色名称
  optional string name = 4 [(buf.validate.field).string.max_len = 20];
  // 角色状态
  optional enum.Status status = 5 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "角色状态 0 未知 1 启用 2 禁用"}
  ];
  // 角色描述
  optional string remark = 6 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "角色描述"}
  ];
  // 创建时间
  optional string start_created_at = 7 [(gnostic.openapi.v3.property) = {description: "创建时间范围开始"}];
  optional string end_created_at = 8 [(gnostic.openapi.v3.property) = {description: "创建时间范围结束"}];

  // Optional. The standard list filter.
  // Supported fields:
  //    * `name` (i.e. `name="John Doe"`)
  //    * `email` (i.e. `email="admin@go-kratos.dev"`)
  //    * `phone` (i.e. `phone="+1234567890"`)
  //    * `create_time` range (i.e. `timestamp>="2025-01-31T11:30:00-04:00"` where
  //    the timestamp is in RFC 3339 format)
  //
  // More detail in [AIP-160](https://google.aip.dev/160).
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  // Optional. A comma-separated list of fields to order by, sorted in ascending
  // order. Use "desc" after a field name for descending. Supported fields:
  // - `create_time`
  //
  // Example: `create_time desc`.
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}]; // Number of resource to skip in the request.
  // * A request with no page token and a skip value of 30 returns a single
  //   page of results starting with the 31st result.
  // * A request with a page token corresponding to the 51st result (because the
  //   first 50 results were returned on the first page) and a skip value of 30
  //   returns a single page of results starting with the 81st result.
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

// 分页查询角色响应
message ListRolesResponse {
  repeated Role items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

// 判断角色名是否存在请求
message ExistRoleByNameRequest {
  optional uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "角色ID"}
  ];
  string name = 2 [
    (buf.validate.field).string.max_len = 20,
    (gnostic.openapi.v3.property) = {description: "角色名"}
  ];
}

// 判断角色名是否存在响应
message ExistRoleByNameResponse {
  bool exist = 1 [(gnostic.openapi.v3.property) = {description: "角色名是否存在"}];
}

// 更新角色状态请求
message UpdateRoleByStatusRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "角色ID"}
  ];
  optional enum.Status status = 2 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "角色状态 0 未知 1 启用 2 禁用"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 更新角色状态响应
message UpdateRoleByStatusResponse {}
