syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "gnostic/openapi/v3/annotations.proto";
import "core/service/v1/menu_permission_group.proto";

option go_package = "backend-service/api/core/service/v1;v1";
option java_multiple_files = true;
option java_package = "core.service.v1";

service TenantService {
  // 创建租户
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  // 更新租户
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  // 删除租户
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  // 获取租户
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // 分页查询租户
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
}

enum TenantLifecycleStatus {
  TENANT_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  TENANT_LIFECYCLE_STATUS_PENDING = 1;
  TENANT_LIFECYCLE_STATUS_ACTIVE = 2;
  TENANT_LIFECYCLE_STATUS_SUSPENDED = 3;
  TENANT_LIFECYCLE_STATUS_EXPIRED = 4;
  TENANT_LIFECYCLE_STATUS_CANCELLED = 5;
}

message TenantInitialAdmin {
  string username = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 32
    pattern: "^[a-zA-Z0-9_-]+$"
  }];
  string password = 2 [(buf.validate.field).string = {
    min_len: 12
    max_len: 72
  }];
  optional string realname = 3 [(buf.validate.field).string.max_len = 50];
  optional string email = 4 [(buf.validate.field).string = {
    email: true
    max_len: 100
  }];
}

// 租户信息
message Tenant {
  // 租户ID
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "租户ID"}];
  // 租户名称
  optional string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 50
    },
    (gnostic.openapi.v3.property) = {description: "租户名称"}
  ];
  // 租户编码
  optional string code = 8 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
      pattern: "^[a-zA-Z0-9_-]+$"
    },
    (gnostic.openapi.v3.property) = {description: "租户编码"}
  ];
  // 排序值
  optional int32 sort = 3 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    },
    (gnostic.openapi.v3.property) = {
      description: "排序值"
      default: {number: 10}
    }
  ];
  // 租户状态 1 激活 2 未激活 3 禁用
  optional enum.Status status = 4 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "租户状态 1 激活 2 未激活 3 禁用"}
  ];
  // 备注信息
  optional string remark = 5 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "备注信息"}
  ];
  // 创建时间
  optional string created_at = 6 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  optional string updated_at = 7 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 绑定的租户业务套餐ID列表
  repeated uint32 group_ids = 9 [(gnostic.openapi.v3.property) = {description: "绑定的租户业务套餐ID列表"}];
  // 绑定的租户业务套餐
  repeated MenuPermissionGroup groups = 10 [(gnostic.openapi.v3.property) = {description: "绑定的租户业务套餐"}];
  optional TenantLifecycleStatus lifecycle_status = 11 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "租户生命周期状态"}
  ];
  optional string activated_at = 12 [(gnostic.openapi.v3.property) = {description: "激活时间"}];
  optional string expires_at = 13 [(gnostic.openapi.v3.property) = {description: "到期时间"}];
  optional string suspended_at = 14 [(gnostic.openapi.v3.property) = {description: "暂停时间"}];
  optional string cancelled_at = 15 [(gnostic.openapi.v3.property) = {description: "注销时间"}];
}

// 创建租户请求
message CreateTenantRequest {
  Tenant tenant = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "租户信息"}
  ];
  // 操作人ID
  uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
  TenantInitialAdmin initial_admin = 3 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "初始租户管理员"}
  ];
}

// 创建租户响应
message CreateTenantResponse {
  // 租户ID
  uint32 id = 1;
  // 租户名称
  string name = 2;
  uint32 admin_user_id = 3;
  uint32 admin_role_id = 4;
  uint32 root_dept_id = 5;
}

// 更新租户请求
message UpdateTenantRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
  Tenant tenant = 2 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "租户信息"}
  ];
  // 操作人ID
  uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 更新租户响应
message UpdateTenantResponse {
  // 租户ID
  uint32 id = 1;
}

// 删除租户请求
message DeleteTenantRequest {
  // 租户ID
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
  // 操作人ID
  uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 删除租户响应
message DeleteTenantResponse {
  // 租户ID
  uint32 id = 1;
}

// 获取租户请求
message GetTenantRequest {
  // 租户ID
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
}

// 获取租户响应
message GetTenantResponse {
  // 租户信息
  Tenant tenant = 1;
}

// 分页查询租户请求
message ListTenantsRequest {
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {description: "当前页码"}
  ];
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {description: "每页数量"}
  ];
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  optional string name = 4 [(buf.validate.field).string.max_len = 50];
  optional string code = 5 [(buf.validate.field).string.max_len = 64];
  optional enum.Status status = 6 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "租户状态"}
  ];
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}];
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

// 分页查询租户响应
message ListTenantsResponse {
  // 租户列表
  repeated Tenant items = 1;
  // 总数
  int32 total = 2;
  string next_page_token = 3;
}

message UpdateTenantStatusRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
  optional enum.Status status = 2 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "租户状态"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

message UpdateTenantStatusResponse {}

message UpdateTenantLifecycleRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  TenantLifecycleStatus lifecycle_status = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0, 1]
    }
  ];
  optional uint32 operator_id = 3 [(buf.validate.field).uint32.gt = 0];
}

message UpdateTenantLifecycleResponse {
  Tenant tenant = 1;
}
