syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "common/pagination/pagination.proto";
import "gnostic/openapi/v3/annotations.proto";

option go_package = "backend-service/api/core/service/v1;v1";
option java_multiple_files = true;
option java_package = "core.service.v1";

service TenantService {
  // 创建租户
  rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
  // 更新租户
  rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
  // 删除租户
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  // 获取租户
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
  // 分页查询租户
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
}

// 租户信息
message Tenant {
  // 租户ID
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "租户ID"}];
  // 租户名称
  optional string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 20
    },
    (gnostic.openapi.v3.property) = {description: "租户名称"}
  ];
  // 排序值
  optional int32 sort = 3 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    },
    (gnostic.openapi.v3.property) = {
      description: "排序值"
      default: {number: 10}
    }
  ];
  // 租户状态 1 激活 2 未激活 3 禁用
  optional enum.Status status = 4 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "租户状态 1 激活 2 未激活 3 禁用"}
  ];
  // 备注信息
  optional string remark = 5 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "备注信息"}
  ];
  // 创建时间
  optional string created_at = 6 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  optional string updated_at = 7 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
}

// 创建租户请求
message CreateTenantRequest {
  Tenant tenant = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "租户信息"}
  ];
  // 操作人ID
  uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 创建租户响应
message CreateTenantResponse {
  // 租户ID
  uint32 id = 1;
  // 租户名称
  string name = 2;
}

// 更新租户请求
message UpdateTenantRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
  Tenant tenant = 2 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "租户信息"}
  ];
  // 操作人ID
  uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 更新租户响应
message UpdateTenantResponse {
  // 租户ID
  uint32 id = 1;
}

// 删除租户请求
message DeleteTenantRequest {
  // 租户ID
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
  // 操作人ID
  uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 删除租户响应
message DeleteTenantResponse {
  // 租户ID
  uint32 id = 1;
}

// 获取租户请求
message GetTenantRequest {
  // 租户ID
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "租户ID"}
  ];
}

// 获取租户响应
message GetTenantResponse {
  // 租户信息
  Tenant tenant = 1;
}

// 分页查询租户请求
message ListTenantsRequest {
  pagination.PagingRequest paging = 1 [(gnostic.openapi.v3.property) = {description: "分页查询参数"}];
}

// 分页查询租户响应
message ListTenantsResponse {
  // 租户列表
  repeated Tenant items = 1;
  // 总数
  int32 total = 2;
}
