syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";

option go_package = "backend-service/api/core/service/v1;v1";
option java_multiple_files = true;
option java_package = "core.service.v1";

service StorageProviderService {
  rpc CreateStorageProvider(CreateStorageProviderRequest) returns (CreateStorageProviderResponse);
  rpc UpdateStorageProvider(UpdateStorageProviderRequest) returns (UpdateStorageProviderResponse);
  rpc DeleteStorageProvider(DeleteStorageProviderRequest) returns (DeleteStorageProviderResponse);
  rpc GetStorageProvider(GetStorageProviderRequest) returns (StorageProvider);
  rpc ListStorageProviders(ListStorageProvidersRequest) returns (ListStorageProvidersResponse);
  rpc SetDefaultStorageProvider(SetDefaultStorageProviderRequest) returns (SetDefaultStorageProviderResponse);
  rpc TestStorageProvider(TestStorageProviderRequest) returns (TestStorageProviderResponse);
}

message StorageProvider {
  uint32 id = 1;
  string code = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 80
    },
    (gnostic.openapi.v3.property) = {description: "存储渠道编码"}
  ];
  string name = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 120
    },
    (gnostic.openapi.v3.property) = {description: "存储渠道名称"}
  ];
  string type = 4 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 40
    },
    (gnostic.openapi.v3.property) = {description: "存储类型：s3-compatible/local"}
  ];
  optional string endpoint = 5 [(buf.validate.field).string.max_len = 255];
  optional string region = 6 [(buf.validate.field).string.max_len = 80];
  optional string access_key = 7 [(buf.validate.field).string.max_len = 120];
  optional string secret_key = 8 [(buf.validate.field).string.max_len = 200];
  optional string session_token = 9 [(buf.validate.field).string.max_len = 500];
  optional bool use_ssl = 10;
  optional bool force_path_style = 11;
  optional string public_base_url = 12 [(buf.validate.field).string.max_len = 255];
  optional string default_bucket = 13 [(buf.validate.field).string.max_len = 120];
  optional string local_base_path = 14 [(buf.validate.field).string.max_len = 500];
  optional int32 status = 15 [(gnostic.openapi.v3.property) = {description: "状态：1启用 2禁用"}];
  optional bool is_default = 16;
  optional string health_status = 17 [(gnostic.openapi.v3.property) = {description: "健康状态：unknown/healthy/unhealthy"}];
  optional string last_checked_at = 18;
  optional string created_at = 19;
  optional string updated_at = 20;
  optional string deleted_at = 21;
  optional string remark = 22 [(buf.validate.field).string.max_len = 500];
  optional bool secret_configured = 23 [(gnostic.openapi.v3.property) = {description: "是否已配置密钥"}];
}

message CreateStorageProviderRequest {
  StorageProvider provider = 1;
}

message CreateStorageProviderResponse {
  StorageProvider provider = 1;
}

message UpdateStorageProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  StorageProvider provider = 2;
}

message UpdateStorageProviderResponse {
  StorageProvider provider = 1;
}

message DeleteStorageProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message DeleteStorageProviderResponse {}

message GetStorageProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message ListStorageProvidersRequest {
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 10}
    }
  ];
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  optional string code = 4 [(buf.validate.field).string.max_len = 80];
  optional string name = 5 [(buf.validate.field).string.max_len = 120];
  optional string type = 6 [(buf.validate.field).string.max_len = 40];
  optional int32 status = 7;
  optional bool is_default = 8;
}

message ListStorageProvidersResponse {
  repeated StorageProvider items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message SetDefaultStorageProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message SetDefaultStorageProviderResponse {
  StorageProvider provider = 1;
}

message TestStorageProviderRequest {
  uint32 id = 1;
  StorageProvider provider = 2;
}

message TestStorageProviderResponse {
  bool healthy = 1;
  string message = 2;
}
