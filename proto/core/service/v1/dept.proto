syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "common/pagination/pagination.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "backend-service/api/core/service/v1;v1";

service DeptService {
  // 创建部门
  rpc CreateDept(CreateDeptRequest) returns (CreateDeptResponse);
  // 更新部门
  rpc UpdateDept(UpdateDeptRequest) returns (UpdateDeptResponse);
  // 删除部门
  rpc DeleteDept(DeleteDeptRequest) returns (DeleteDeptResponse);
  // 获取部门
  rpc GetDept(GetDeptRequest) returns (GetDeptResponse);
  // 分页查询部门
  rpc ListDepts(ListDeptsRequest) returns (ListDeptsResponse);
  // 查询部门树形列表
  rpc ListDeptsTree(ListDeptsTreeRequest) returns (ListDeptsTreeResponse);
  // 更新部门状态
  rpc UpdateDeptByStatus(UpdateDeptByStatusRequest) returns (UpdateDeptByStatusResponse);
}

// 部门信息
message Dept {
  // 部门ID
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "部门ID"}];
  // 部门名称
  optional string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 20
    },
    (gnostic.openapi.v3.property) = {description: "部门名称"}
  ];
  // 父部门ID
  optional uint32 parent_id = 3 [
    (buf.validate.field).uint32.gte = 0,
    (gnostic.openapi.v3.property) = {description: "父部门ID"}
  ];
  // 部门领导ID
  optional uint32 leader_id = 4 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门领导ID"}
  ];
  // 排序字段
  optional int32 sort = 5 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    },
    (gnostic.openapi.v3.property) = {
      description: "排序字段"
      default: {number: 10}
    }
  ];
  // 部门状态 1 启用 2 禁用
  optional enum.Status status = 6 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]},
    (gnostic.openapi.v3.property) = {
      description: "部门状态 1 启用 2 禁用"
      default: {number: 1}
    }
  ];
  // 部门描述
  optional string remark = 7 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "部门描述"}
  ];
  // 创建时间
  optional string created_at = 8 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  optional string updated_at = 9 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 子级
  repeated Dept children = 10 [(gnostic.openapi.v3.property) = {description: "子级"}];
  // 祖籍
  repeated uint32 ancestors = 11 [(gnostic.openapi.v3.property) = {description: "祖籍"}];
  uint32 direct_user_count = 12 [(gnostic.openapi.v3.property) = {description: "直接归属用户数"}];
  uint32 total_user_count = 13 [(gnostic.openapi.v3.property) = {description: "包含下级部门的用户数"}];
}

// 创建部门请求
message CreateDeptRequest {
  Dept dept = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "部门信息"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 创建部门响应
message CreateDeptResponse {}

// 更新部门请求
message UpdateDeptRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
  Dept dept = 2 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "部门信息"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
  // Required. Mask of fields to update.
  google.protobuf.FieldMask update_mask = 4 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "更新字段掩码"}
  ];
}

// 更新部门响应
message UpdateDeptResponse {}

// 删除部门请求
message DeleteDeptRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 删除部门响应
message DeleteDeptResponse {}

message GetDeptDeleteImpactRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message GetDeptDeleteImpactResponse {
  uint32 id = 1;
  string name = 2;
  uint32 direct_user_count = 3;
  bool has_children = 4;
  bool is_protected_root = 5;
  bool has_data_scope_roles = 6;
  bool can_delete_directly = 7;
  bool requires_user_transfer = 8;
}

message TransferAndDeleteDeptRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  uint32 target_dept_id = 2 [(buf.validate.field).uint32.gt = 0];
  optional uint32 operator_id = 3 [(buf.validate.field).uint32.gt = 0];
}

message TransferAndDeleteDeptResponse {
  uint32 transferred_user_count = 1;
}

// 获取部门请求
message GetDeptRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
}

// 获取部门响应
message GetDeptResponse {
  Dept dept = 1 [(gnostic.openapi.v3.property) = {description: "部门信息"}];
}

// 分页查询部门请求
message ListDeptsRequest {
  // 当前页码
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  // 每页的行数
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 10}
    }
  ];
  // 是否不分页
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  // 部门名称
  optional string name = 4 [(buf.validate.field).string.max_len = 20];
  // 部门状态
  optional enum.Status status = 5 [
    (buf.validate.field).enum = {defined_only: true, not_in: [0]},
    (gnostic.openapi.v3.property) = {description: "部门状态 0 未知 1 启用 2 禁用"}
  ];
  // 部门描述
  optional string remark = 6 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "部门描述"}
  ];

  // Optional. The standard list filter.
  // Supported fields:
  //    * `name` (i.e. `name="John Doe"`)
  //    * `email` (i.e. `email="admin@go-kratos.dev"`)
  //    * `phone` (i.e. `phone="+1234567890"`)
  //    * `create_time` range (i.e. `timestamp>="2025-01-31T11:30:00-04:00"` where
  //    the timestamp is in RFC 3339 format)
  //
  // More detail in [AIP-160](https://google.aip.dev/160).
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  // Optional. A comma-separated list of fields to order by, sorted in ascending
  // order. Use "desc" after a field name for descending. Supported fields:
  // - `create_time`
  //
  // Example: `create_time desc`.
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}]; // Number of resource to skip in the request.
  // * A request with no page token and a skip value of 30 returns a single
  //   page of results starting with the 31st result.
  // * A request with a page token corresponding to the 51st result (because the
  //   first 50 results were returned on the first page) and a skip value of 30
  //   returns a single page of results starting with the 81st result.
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

// 分页查询部门响应
message ListDeptsResponse {
  repeated Dept items = 1 [(gnostic.openapi.v3.property) = {description: "部门列表"}];
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总条数"}];
  string next_page_token = 3;
}

// 更新部门状态请求
message UpdateDeptByStatusRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
  int32 status = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1,
    (gnostic.openapi.v3.property) = {description: "部门状态 1 启用 0 禁用"}
  ];
}

// 更新部门状态响应
message UpdateDeptByStatusResponse {}

// 查询部门树形列表请求
message ListDeptsTreeRequest {
  optional uint32 parent_id = 1 [
    (buf.validate.field).uint32.gte = 0,
    (gnostic.openapi.v3.property) = {description: "父部门ID"}
  ];
}

// 查询部门树形列表响应
message ListDeptsTreeResponse {
  repeated Dept items = 1 [(gnostic.openapi.v3.property) = {description: "部门树形列表"}];
}
