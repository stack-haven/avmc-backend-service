syntax = "proto3";

package core.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "common/pagination/pagination.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

option go_package = "backend-service/api/core/service/v1;v1";

service DeptService {
  // 创建部门
  rpc CreateDept(CreateDeptRequest) returns (CreateDeptResponse);
  // 更新部门
  rpc UpdateDept(UpdateDeptRequest) returns (UpdateDeptResponse);
  // 删除部门
  rpc DeleteDept(DeleteDeptRequest) returns (DeleteDeptResponse);
  // 获取部门
  rpc GetDept(GetDeptRequest) returns (GetDeptResponse);
  // 分页查询部门
  rpc ListDept(pagination.PagingRequest) returns (ListDeptResponse);
  // 查询部门树形列表
  rpc ListDeptTree(ListDeptTreeRequest) returns (ListDeptTreeResponse);
  // 更新部门状态
  rpc UpdateDeptByStatus(UpdateDeptByStatusRequest) returns (UpdateDeptByStatusResponse);
}

// 部门信息
message Dept {
  // 部门ID
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "部门ID"}];
  // 部门名称
  optional string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 20
    },
    (gnostic.openapi.v3.property) = {description: "部门名称"}
  ];
  // 父部门ID
  optional uint32 parent_id = 3 [
    (buf.validate.field).uint32.gte = 0,
    (gnostic.openapi.v3.property) = {description: "父部门ID"}
  ];
  // 部门领导ID
  optional uint32 leader_id = 4 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门领导ID"}
  ];
  // 排序字段
  optional int32 sort = 5 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    },
    (gnostic.openapi.v3.property) = {
      description: "排序字段"
      default: {number: 10}
    }
  ];
  // 部门状态 1 启用 2 禁用
  optional enum.Status status = 6 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {
      description: "部门状态 1 启用 2 禁用"
      default: {number: 1}
    }
  ];
  // 部门描述
  optional string remark = 7 [
    (buf.validate.field).string.max_len = 200,
    (gnostic.openapi.v3.property) = {description: "部门描述"}
  ];
  // 创建时间
  optional string created_at = 8 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  // 更新时间
  optional string updated_at = 9 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  // 子级
  repeated Dept children = 10 [(gnostic.openapi.v3.property) = {description: "子级"}];
  // 祖籍
  repeated uint32 ancestors = 11 [(gnostic.openapi.v3.property) = {description: "祖籍"}];
}

// 创建部门请求
message CreateDeptRequest {
  Dept dept = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "部门信息"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 创建部门响应
message CreateDeptResponse {}

// 更新部门请求
message UpdateDeptRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
  Dept dept = 2 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "部门信息"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 更新部门响应
message UpdateDeptResponse {}

// 删除部门请求
message DeleteDeptRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 删除部门响应
message DeleteDeptResponse {}

// 获取部门请求
message GetDeptRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
}

// 获取部门响应
message GetDeptResponse {
  Dept dept = 1 [(gnostic.openapi.v3.property) = {description: "部门信息"}];
}

// 分页查询部门请求
message ListDeptRequest {
  pagination.PagingRequest pagination = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "分页参数"}
  ];
  optional string name = 2 [
    (buf.validate.field).string.max_len = 20,
    (gnostic.openapi.v3.property) = {description: "部门名称"}
  ];
  optional int32 state = 3 [(gnostic.openapi.v3.property) = {description: "部门状态"}];
  optional uint32 parent_id = 4 [(gnostic.openapi.v3.property) = {description: "父部门ID"}];
}

// 分页查询部门响应
message ListDeptResponse {
  repeated Dept items = 1 [(gnostic.openapi.v3.property) = {description: "部门列表"}];
  int32 total = 2 [(gnostic.openapi.v3.property) = {description: "总条数"}];
}

// 更新部门状态请求
message UpdateDeptByStatusRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "部门ID"}
  ];
  int32 status = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1,
    (gnostic.openapi.v3.property) = {description: "部门状态 1 启用 0 禁用"}
  ];
}

// 更新部门状态响应
message UpdateDeptByStatusResponse {}

// 查询部门树形列表请求
message ListDeptTreeRequest {
  optional uint32 parent_id = 1 [
    (buf.validate.field).uint32.gte = 0,
    (gnostic.openapi.v3.property) = {description: "父部门ID"}
  ];
}

// 查询部门树形列表响应
message ListDeptTreeResponse {
  repeated Dept items = 1 [(gnostic.openapi.v3.property) = {description: "部门树形列表"}];
}
