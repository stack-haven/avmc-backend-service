syntax = "proto3";

package platform.admin.v1;

import "common/pagination/pagination.proto";
import "core/service/v1/menu.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 菜单管理服务
service MenuService {
  // 获取所有菜单
  rpc ListMenusAll(google.protobuf.Empty) returns (core.service.v1.ListMenusResponse) {
    option (google.api.http) = {get: "/admin/v1/menus/all"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取所有菜单"
      description: "获取所有菜单"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
  // 获取菜单树
  rpc ListMenusTree(core.service.v1.ListMenusTreeRequest) returns (core.service.v1.ListMenusTreeResponse) {
    option (google.api.http) = {
      get: "/admin/v1/menus/tree/{parent_id}"
      additional_bindings: [
        {get: "/admin/v1/menus/tree"}]
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "获取菜单树"
      description: "获取菜单树"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
  // 获取菜单列表
  rpc ListMenus(core.service.v1.ListMenusRequest) returns (core.service.v1.ListMenusResponse) {
    option (google.api.http) = {get: "/admin/v1/menus"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取菜单列表"
      description: "获取菜单列表"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取菜单数据
  rpc GetMenu(core.service.v1.GetMenuRequest) returns (core.service.v1.Menu) {
    option (google.api.http) = {get: "/admin/v1/menus/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取菜单数据"
      description: "获取菜单数据"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 创建菜单
  rpc CreateMenu(core.service.v1.CreateMenuRequest) returns (core.service.v1.CreateMenuResponse) {
    option (google.api.http) = {
      post: "/admin/v1/menus"
      body: "menu"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建菜单"
      description: "创建菜单"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新菜单
  rpc UpdateMenu(core.service.v1.UpdateMenuRequest) returns (core.service.v1.UpdateMenuResponse) {
    option (google.api.http) = {
      put: "/admin/v1/menus/{id}"
      body: "menu"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新菜单"
      description: "更新菜单"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 删除菜单
  rpc DeleteMenu(core.service.v1.DeleteMenuRequest) returns (core.service.v1.DeleteMenuResponse) {
    option (google.api.http) = {delete: "/admin/v1/menus/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除菜单"
      description: "删除菜单"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
  // 判断菜单路径是否存在
  rpc ExistMenuByPath(core.service.v1.ExistMenuByPathRequest) returns (core.service.v1.ExistMenuByPathResponse) {
    option (google.api.http) = {
      get: "/admin/v1/menus/path-exists/{id}"
      additional_bindings: [
        {
          post: "/admin/v1/menus/path-exists"
          body: "*"
        }
      ]
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "判断菜单路径是否存在"
      description: "判断菜单路径是否存在"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
  // 判断菜单名是否存在
  rpc ExistMenuByName(core.service.v1.ExistMenuByNameRequest) returns (core.service.v1.ExistMenuByNameResponse) {
    option (google.api.http) = {
      get: "/admin/v1/menus/name-exists/{id}"
      // query 参数映射字段 ?id=123&name=菜单A
      additional_bindings: [
        {
          post: "/admin/v1/menus/name-exists"
          body: "*"
        }
      ]
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "判断菜单名是否存在"
      description: "判断菜单名是否存在"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新菜单状态
  rpc UpdateMenuByStatus(core.service.v1.UpdateMenuByStatusRequest) returns (core.service.v1.UpdateMenuByStatusResponse) {
    option (google.api.http) = {
      post: "/admin/v1/menus/{id}:status-update"
      body: "status"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新菜单状态"
      description: "更新菜单状态"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
}
