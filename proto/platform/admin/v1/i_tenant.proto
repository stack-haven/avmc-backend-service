syntax = "proto3";

package platform.admin.v1;

import "core/service/v1/tenant.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 租户管理服务
service TenantService {
  // 获取租户列表
  rpc ListTenants(core.service.v1.ListTenantsRequest) returns (core.service.v1.ListTenantsResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户列表"
      description: "获取租户列表"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取租户
  rpc GetTenant(core.service.v1.GetTenantRequest) returns (core.service.v1.Tenant) {
    option (google.api.http) = {get: "/admin/v1/tenants/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户"
      description: "获取租户"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 创建租户
  rpc CreateTenant(core.service.v1.CreateTenantRequest) returns (core.service.v1.CreateTenantResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建租户"
      description: "创建租户"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  rpc UpdateTenantLifecycle(core.service.v1.UpdateTenantLifecycleRequest) returns (core.service.v1.UpdateTenantLifecycleResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{id}/lifecycle"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户生命周期"
      description: "按状态机更新租户生命周期"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新租户
  rpc UpdateTenant(core.service.v1.UpdateTenantRequest) returns (core.service.v1.UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{id}"
      body: "tenant"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户"
      description: "更新租户"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 删除租户
  rpc DeleteTenant(core.service.v1.DeleteTenantRequest) returns (core.service.v1.DeleteTenantResponse) {
    option (google.api.http) = {delete: "/admin/v1/tenants/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除租户"
      description: "删除租户"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新租户状态
  rpc UpdateTenantStatus(core.service.v1.UpdateTenantStatusRequest) returns (core.service.v1.UpdateTenantStatusResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/status-update/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户状态"
      description: "更新租户状态"
      tags: ["租户管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
}
