syntax = "proto3";

package platform.admin.v1;

import "core/service/v1/tenant.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 租户管理服务
service TenantService {
  // 获取租户列表
  rpc ListTenants(core.service.v1.ListTenantsRequest) returns (core.service.v1.ListTenantsResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户列表"
      description: "获取租户列表"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  // 获取租户简易列表（公开接口，无需登录）
  rpc ListTenantSimples(core.service.v1.ListTenantSimplesRequest) returns (core.service.v1.ListTenantSimplesResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants/simples"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户简易列表"
      description: "获取租户简易列表（公开接口，无需登录，用于登录页租户搜索）"
      tags: ["租户管理服务"]
    };
  }

  // 获取租户详情
  rpc GetTenant(core.service.v1.GetTenantRequest) returns (core.service.v1.Tenant) {
    option (google.api.http) = {get: "/admin/v1/tenants/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户"
      description: "获取租户详情"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  // 创建租户（原子开通）
  rpc CreateTenant(core.service.v1.CreateTenantRequest) returns (core.service.v1.CreateTenantResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建租户"
      description: "原子开通：创建租户+绑定套餐+创建根部门+创建管理员"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  // 更新租户基本信息
  rpc UpdateTenant(core.service.v1.UpdateTenantRequest) returns (core.service.v1.UpdateTenantResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{id}"
      body: "tenant"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户"
      description: "更新租户基本信息"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  // 删除租户
  rpc DeleteTenant(core.service.v1.DeleteTenantRequest) returns (core.service.v1.DeleteTenantResponse) {
    option (google.api.http) = {delete: "/admin/v1/tenants/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除租户"
      description: "删除租户"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  // 更新租户生命周期状态
  rpc UpdateTenantLifecycle(core.service.v1.UpdateTenantLifecycleRequest) returns (core.service.v1.UpdateTenantLifecycleResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{id}/lifecycle"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户生命周期"
      description: "按状态机更新租户生命周期"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  rpc ListTenantAdmins(core.service.v1.ListTenantAdminsRequest) returns (core.service.v1.ListTenantAdminsResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants/{tenant_id}/admins"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户管理员"
      description: "获取目标租户中绑定系统租户管理员角色的账号"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  rpc UpdateTenantAdmin(core.service.v1.UpdateTenantAdminRequest) returns (core.service.v1.UpdateTenantAdminResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{tenant_id}/admins/{admin_user_id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户管理员资料"
      description: "更新目标租户管理员的姓名、邮箱和手机号"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }

  rpc ResetTenantAdminPassword(core.service.v1.ResetTenantAdminPasswordRequest) returns (core.service.v1.ResetTenantAdminPasswordResponse) {
    option (google.api.http) = {
      post: "/admin/v1/tenants/{tenant_id}/admins/{admin_user_id}:reset-password"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "重置租户管理员密码"
      description: "重置目标租户管理员密码并撤销其现有会话"
      tags: ["租户管理服务"]
      security: [{additional_properties: [{name: "BearerAuth" value: {}}]}]
    };
  }
}
