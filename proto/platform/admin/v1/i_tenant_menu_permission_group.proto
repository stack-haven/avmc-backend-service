syntax = "proto3";

package platform.admin.v1;

import "core/service/v1/tenant_menu_permission_group.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 菜单权限组服务
