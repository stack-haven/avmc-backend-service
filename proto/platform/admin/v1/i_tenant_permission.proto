syntax = "proto3";

package platform.admin.v1;

import "core/service/v1/menu_permission_group.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 租户权限服务
service TenantPermissionService {
  // 获取租户绑定的菜单权限组
  rpc GetTenantPermissionGroups(core.service.v1.GetTenantPermissionGroupsRequest) returns (core.service.v1.GetTenantPermissionGroupsResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants/{tenant_id}/permission-groups"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户绑定的菜单权限组"
      description: "获取租户绑定的菜单权限组"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新租户绑定的菜单权限组
  rpc UpdateTenantPermissionGroups(core.service.v1.UpdateTenantPermissionGroupsRequest) returns (core.service.v1.UpdateTenantPermissionGroupsResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{tenant_id}/permission-groups"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新租户绑定的菜单权限组"
      description: "更新租户绑定的菜单权限组"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取租户最终有效菜单树
  rpc GetTenantEffectiveMenus(core.service.v1.GetTenantEffectiveMenusRequest) returns (core.service.v1.GetTenantEffectiveMenusResponse) {
    option (google.api.http) = {get: "/admin/v1/tenants/{tenant_id}/effective-menus"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取租户最终有效菜单树"
      description: "获取租户最终有效菜单树"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取当前登录租户最终有效菜单树
  rpc GetCurrentTenantEffectiveMenus(core.service.v1.GetCurrentTenantEffectiveMenusRequest) returns (core.service.v1.GetTenantEffectiveMenusResponse) {
    option (google.api.http) = {get: "/admin/v1/current-tenant/effective-menus"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取当前登录租户最终有效菜单树"
      description: "获取当前登录租户最终有效菜单树"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取当前登录租户运行时能力配置
  rpc GetCurrentTenantCapabilities(core.service.v1.GetCurrentTenantCapabilitiesRequest) returns (core.service.v1.GetCurrentTenantCapabilitiesResponse) {
    option (google.api.http) = {get: "/admin/v1/current-tenant/capabilities"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取当前登录租户运行时能力配置"
      description: "聚合当前租户绑定套餐及版本中的接口能力、功能开关和资源额度"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  rpc ListCurrentTenantResourceQuotas(core.service.v1.ListCurrentTenantResourceQuotasRequest) returns (core.service.v1.ListCurrentTenantResourceQuotasResponse) {
    option (google.api.http) = {get: "/admin/v1/current-tenant/resource-quotas"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询当前租户资源额度"
      description: "返回当前租户套餐额度定义和已使用量"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  rpc CheckCurrentTenantResourceQuota(core.service.v1.CheckCurrentTenantResourceQuotaRequest) returns (core.service.v1.CheckCurrentTenantResourceQuotaResponse) {
    option (google.api.http) = {get: "/admin/v1/current-tenant/resource-quotas/{resource_key}:check"};
    option (gnostic.openapi.v3.operation) = {
      summary: "检查当前租户资源额度"
      description: "检查本次资源占用是否会超过当前租户套餐额度"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  rpc ConsumeCurrentTenantResourceQuota(core.service.v1.ConsumeCurrentTenantResourceQuotaRequest) returns (core.service.v1.ConsumeCurrentTenantResourceQuotaResponse) {
    option (google.api.http) = {post: "/admin/v1/current-tenant/resource-quotas/{resource_key}:consume" body: "*"};
    option (gnostic.openapi.v3.operation) = {
      summary: "占用当前租户资源额度"
      description: "原子检查并占用当前租户资源额度，超额时拒绝"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  rpc ReleaseCurrentTenantResourceQuota(core.service.v1.ReleaseCurrentTenantResourceQuotaRequest) returns (core.service.v1.ReleaseCurrentTenantResourceQuotaResponse) {
    option (google.api.http) = {post: "/admin/v1/current-tenant/resource-quotas/{resource_key}:release" body: "*"};
    option (gnostic.openapi.v3.operation) = {
      summary: "释放当前租户资源额度"
      description: "释放当前租户已占用资源额度，释放后使用量不会小于0"
      tags: ["租户权限服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  rpc UpdateTenantPermissionGroupVersion(core.service.v1.UpdateTenantPermissionGroupVersionRequest) returns (core.service.v1.UpdateTenantPermissionGroupVersionResponse) {
    option (google.api.http) = {
      put: "/admin/v1/tenants/{tenant_id}/permission-groups/{group_id}/version"
      body: "*"
    };
  }
}
