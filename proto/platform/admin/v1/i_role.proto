syntax = "proto3";

package platform.admin.v1;

import "common/pagination/pagination.proto";
import "core/service/v1/role.proto";
import "core/service/v1/user.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 角色管理服务
service RoleService {
  // 获取角色简单列表
  rpc ListRoleSimple(core.service.v1.ListRoleSimpleRequest) returns (core.service.v1.ListRoleSimpleResponse) {
    option (google.api.http) = {get: "/admin/v1/roles/simple"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取角色简单列表"
      description: "获取角色简单列表，用于用户角色配置、筛选项和绑定选择等轻量场景"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取角色列表
  rpc ListRoles(core.service.v1.ListRolesRequest) returns (core.service.v1.ListRolesResponse) {
    option (google.api.http) = {get: "/admin/v1/roles"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取角色列表"
      description: "获取角色列表"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取角色数据
  rpc GetRole(core.service.v1.GetRoleRequest) returns (core.service.v1.Role) {
    option (google.api.http) = {get: "/admin/v1/roles/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取角色数据"
      description: "获取角色数据"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 创建角色
  rpc CreateRole(core.service.v1.CreateRoleRequest) returns (core.service.v1.CreateRoleResponse) {
    option (google.api.http) = {
      post: "/admin/v1/roles"
      body: "role"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建角色"
      description: "创建角色"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新角色
  rpc UpdateRole(core.service.v1.UpdateRoleRequest) returns (core.service.v1.UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/admin/v1/roles/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新角色"
      description: "更新角色"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 删除角色
  rpc DeleteRole(core.service.v1.DeleteRoleRequest) returns (core.service.v1.DeleteRoleResponse) {
    option (google.api.http) = {delete: "/admin/v1/roles/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除角色"
      description: "删除角色"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 判断角色名是否存在
  rpc ExistRoleByName(core.service.v1.ExistRoleByNameRequest) returns (core.service.v1.ExistRoleByNameResponse) {
    option (google.api.http) = {
      get: "/admin/v1/roles/name-exists/{id}"
      // query 参数映射字段 ?id=123&name=角色A
      additional_bindings: [
        {
          post: "/admin/v1/roles/name-exists"
          body: "*"
        }
      ]
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "判断菜单名是否存在"
      description: "判断菜单名是否存在"
      tags: ["菜单管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新角色状态
  rpc UpdateRoleByStatus(core.service.v1.UpdateRoleByStatusRequest) returns (core.service.v1.UpdateRoleByStatusResponse) {
    option (google.api.http) = {
      post: "/admin/v1/roles/{id}:status-update"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新角色状态"
      description: "更新角色状态"
      tags: ["角色管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
}
