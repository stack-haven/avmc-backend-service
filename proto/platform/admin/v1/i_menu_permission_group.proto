            }
          ]
        }
      ]
    };
  }

  // 更新菜单权限组
  rpc UpdateMenuPermissionGroup(core.service.v1.UpdateMenuPermissionGroupRequest) returns (core.service.v1.UpdateMenuPermissionGroupResponse) {
    option (google.api.http) = {
