    };
  }

  // 更新菜单权限组状态
  rpc UpdateMenuPermissionGroupStatus(core.service.v1.UpdateMenuPermissionGroupStatusRequest) returns (core.service.v1.UpdateMenuPermissionGroupStatusResponse) {
    option (google.api.http) = {
      put: "/admin/v1/menu-permission-groups/status-update/{id}"
