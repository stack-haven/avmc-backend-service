  // 删除菜单权限组
  rpc DeleteMenuPermissionGroup(core.service.v1.DeleteMenuPermissionGroupRequest) returns (core.service.v1.DeleteMenuPermissionGroupResponse) {
    option (google.api.http) = {delete: "/admin/v1/menu-permission-groups/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除菜单权限组"
      description: "删除菜单权限组"
      tags: ["菜单权限组服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
