syntax = "proto3";

package platform.admin.v1;

import "core/service/v1/menu_permission_group.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/admin/v1;v1";

// 菜单权限组服务
service MenuPermissionGroupService {
  // 获取菜单权限组列表
  rpc ListMenuPermissionGroups(core.service.v1.ListMenuPermissionGroupsRequest) returns (core.service.v1.ListMenuPermissionGroupsResponse) {
    option (google.api.http) = {get: "/admin/v1/menu-permission-groups"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取菜单权限组列表"
      description: "获取菜单权限组列表"
      tags: ["菜单权限组服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取菜单权限组
  rpc GetMenuPermissionGroup(core.service.v1.GetMenuPermissionGroupRequest) returns (core.service.v1.MenuPermissionGroup) {
