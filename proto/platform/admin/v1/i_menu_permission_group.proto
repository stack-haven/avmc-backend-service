  }

  // 创建菜单权限组
  rpc CreateMenuPermissionGroup(core.service.v1.CreateMenuPermissionGroupRequest) returns (core.service.v1.CreateMenuPermissionGroupResponse) {
    option (google.api.http) = {
      post: "/admin/v1/menu-permission-groups"
      body: "group"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建菜单权限组"
      description: "创建菜单权限组"
      tags: ["菜单权限组服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
