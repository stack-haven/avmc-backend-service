syntax = "proto3";

package platform.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";

option go_package = "backend-service/api/platform/service/v1;v1";


service WebhookService {
  // Subscription management
  rpc ListWebhookSubscriptions(ListWebhookSubscriptionsRequest) returns (ListWebhookSubscriptionsResponse) {
    option (google.api.http) = {get: "/platform/v1/webhook-subscriptions"};
  }

  rpc GetWebhookSubscription(GetWebhookSubscriptionRequest) returns (WebhookSubscription) {
    option (google.api.http) = {get: "/platform/v1/webhook-subscriptions/{id}"};
  }

  rpc CreateWebhookSubscription(CreateWebhookSubscriptionRequest) returns (WebhookSubscription) {
    option (google.api.http) = {post: "/platform/v1/webhook-subscriptions" body: "subscription"};
  }

  rpc UpdateWebhookSubscription(UpdateWebhookSubscriptionRequest) returns (WebhookSubscription) {
    option (google.api.http) = {put: "/platform/v1/webhook-subscriptions/{id}" body: "subscription"};
  }

  rpc DeleteWebhookSubscription(DeleteWebhookSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/platform/v1/webhook-subscriptions/{id}"};
  }

  // Delivery log management
  rpc ListWebhookDeliveryLogs(ListWebhookDeliveryLogsRequest) returns (ListWebhookDeliveryLogsResponse) {
    option (google.api.http) = {get: "/platform/v1/webhook-delivery-logs"};
  }

  rpc GetWebhookDeliveryLog(GetWebhookDeliveryLogRequest) returns (WebhookDeliveryLog) {
    option (google.api.http) = {get: "/platform/v1/webhook-delivery-logs/{id}"};
  }

  rpc RetryWebhookDelivery(RetryWebhookDeliveryRequest) returns (RetryWebhookDeliveryResponse) {
    option (google.api.http) = {post: "/platform/v1/webhook-delivery-logs/{id}:retry" body: "*"};
  }
}


// =============================================================================
// Webhook Event Types
// =============================================================================

enum WebhookEventType {
  WEBHOOK_EVENT_TYPE_UNSPECIFIED = 0;
  WEBHOOK_EVENT_TYPE_FILE_UPLOAD_COMPLETED = 1;
  WEBHOOK_EVENT_TYPE_RESOURCE_QUOTA_EXCEEDED = 2;
  WEBHOOK_EVENT_TYPE_ASYNC_TASK_FAILED = 3;
  WEBHOOK_EVENT_TYPE_TENANT_CREATED = 4;
  WEBHOOK_EVENT_TYPE_USER_CREATED = 5;
}

// =============================================================================
// Webhook Delivery Status
// =============================================================================

enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNSPECIFIED = 0;
  WEBHOOK_DELIVERY_STATUS_PENDING = 1;
  WEBHOOK_DELIVERY_STATUS_SUCCESS = 2;
  WEBHOOK_DELIVERY_STATUS_FAILED = 3;
}

// =============================================================================
// Webhook Subscription
// =============================================================================

message WebhookSubscription {
  uint32 id = 1;
  optional uint32 tenant_id = 2;
  string name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 100}];
  string url = 4 [(buf.validate.field).string = {min_len: 1, max_len: 2048}];
  string secret = 5 [(buf.validate.field).string = {min_len: 16, max_len: 256}];
  repeated WebhookEventType event_types = 6 [(buf.validate.field).repeated = {min_items: 1, max_items: 20}];
  optional enum.Status status = 7 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string created_at = 8;
  optional string updated_at = 9;
}

// =============================================================================
// Webhook Subscription CRUD Messages
// =============================================================================

message ListWebhookSubscriptionsRequest {
  string page_token = 1;
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  optional string keyword = 3 [(buf.validate.field).string.max_len = 100];
  optional WebhookEventType event_type = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional enum.Status status = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message ListWebhookSubscriptionsResponse {
  repeated WebhookSubscription items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetWebhookSubscriptionRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message CreateWebhookSubscriptionRequest {
  WebhookSubscription subscription = 1 [(buf.validate.field).required = true];
}

message UpdateWebhookSubscriptionRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  WebhookSubscription subscription = 2 [(buf.validate.field).required = true];
}

message DeleteWebhookSubscriptionRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

// =============================================================================
// Webhook Delivery Log
// =============================================================================

message WebhookDeliveryLog {
  uint32 id = 1;
  uint32 tenant_id = 2;
  uint32 subscription_id = 3;
  string event_id = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  WebhookEventType event_type = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string target_url = 6 [(buf.validate.field).string.max_len = 2048];
  string request_body = 7 [(buf.validate.field).string.max_len = 65536];
  optional int32 response_code = 8;
  optional string response_body = 9 [(buf.validate.field).string.max_len = 65536];
  WebhookDeliveryStatus delivery_status = 10 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  int32 attempt_number = 11 [(buf.validate.field).int32.gte = 1];
  optional string error_message = 12 [(buf.validate.field).string.max_len = 1024];
  optional string created_at = 13;
}

// =============================================================================
// Webhook Delivery Log CRUD Messages
// =============================================================================

message ListWebhookDeliveryLogsRequest {
  string page_token = 1;
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  optional uint32 subscription_id = 3;
  optional WebhookEventType event_type = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional WebhookDeliveryStatus delivery_status = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}

message ListWebhookDeliveryLogsResponse {
  repeated WebhookDeliveryLog items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetWebhookDeliveryLogRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message RetryWebhookDeliveryRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message RetryWebhookDeliveryResponse {
  uint32 new_delivery_log_id = 1;
}

// =============================================================================
// Event Publishing (internal use)
// =============================================================================

message PublishWebhookEventRequest {
  WebhookEventType event_type = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string event_id = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string payload = 3 [(buf.validate.field).string = {min_len: 1, max_len: 65536}];
}
