syntax = "proto3";

package platform.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/service/v1;v1";


service NotificationProviderService {
  rpc CreateNotificationProvider(CreateNotificationProviderRequest) returns (CreateNotificationProviderResponse) {
    option (google.api.http) = {
      post: "/platform/v1/notification-providers"
      body: "*"
    };
  }
  rpc UpdateNotificationProvider(UpdateNotificationProviderRequest) returns (UpdateNotificationProviderResponse) {
    option (google.api.http) = {
      put: "/platform/v1/notification-providers/{id}"
      body: "*"
    };
  }
  rpc DeleteNotificationProvider(DeleteNotificationProviderRequest) returns (DeleteNotificationProviderResponse) {
    option (google.api.http) = {delete: "/platform/v1/notification-providers/{id}"};
  }
  rpc GetNotificationProvider(GetNotificationProviderRequest) returns (NotificationProvider) {
    option (google.api.http) = {get: "/platform/v1/notification-providers/{id}"};
  }
  rpc ListNotificationProviders(ListNotificationProvidersRequest) returns (ListNotificationProvidersResponse) {
    option (google.api.http) = {get: "/platform/v1/notification-providers"};
  }
  rpc SetDefaultNotificationProvider(SetDefaultNotificationProviderRequest) returns (SetDefaultNotificationProviderResponse) {
    option (google.api.http) = {
      post: "/platform/v1/notification-providers/{id}:set-default"
      body: "*"
    };
  }
  rpc TestNotificationProvider(TestNotificationProviderRequest) returns (TestNotificationProviderResponse) {
    option (google.api.http) = {
      post: "/platform/v1/notification-providers/{id}:test"
      body: "*"
    };
  }
}

// 通知渠道配置（平台级）。站内信无需外部服务商；短信需配置服务商密钥。
message NotificationProvider {
  uint32 id = 1;
  string code = 2 [
    (buf.validate.field).string = {min_len: 1, max_len: 80},
    (gnostic.openapi.v3.property) = {description: "渠道配置编码"}
  ];
  string name = 3 [
    (buf.validate.field).string = {min_len: 1, max_len: 120},
    (gnostic.openapi.v3.property) = {description: "渠道配置名称"}
  ];
  // 渠道类型：in-app / sms / email / webhook / push
  string channel = 4 [
    (buf.validate.field).string = {min_len: 1, max_len: 40},
    (gnostic.openapi.v3.property) = {description: "渠道类型"}
  ];
  // 提供商类型：aliyun-sms / yunpian / jpush / getui（in-app 为空）
  optional string provider_type = 16 [
    (buf.validate.field).string.max_len = 80,
    (gnostic.openapi.v3.property) = {description: "提供商类型"}
  ];
  optional string endpoint = 5 [(buf.validate.field).string.max_len = 255];
  optional string access_key_id = 6 [(buf.validate.field).string.max_len = 120];
  optional string access_key_secret = 7 [(buf.validate.field).string.max_len = 200];
  optional string sign_name = 8 [(buf.validate.field).string.max_len = 80];
  optional string template_code = 9 [(buf.validate.field).string.max_len = 80];
  optional int32 status = 10 [(gnostic.openapi.v3.property) = {description: "状态 1 启用 2 禁用"}];
  optional bool is_default = 11;
  optional string remark = 12 [(buf.validate.field).string.max_len = 500];
  optional bool secret_configured = 13 [(gnostic.openapi.v3.property) = {description: "是否已配置密钥"}];
  optional string created_at = 14;
  optional string updated_at = 15;
}

message CreateNotificationProviderRequest {
  NotificationProvider provider = 1 [(buf.validate.field).required = true];
}

message CreateNotificationProviderResponse {
  NotificationProvider provider = 1;
}

message UpdateNotificationProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  NotificationProvider provider = 2 [(buf.validate.field).required = true];
}

message UpdateNotificationProviderResponse {
  NotificationProvider provider = 1;
}

message DeleteNotificationProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message DeleteNotificationProviderResponse {}

message GetNotificationProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message ListNotificationProvidersRequest {
  string page_token = 1;
  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
  optional string code = 3 [(buf.validate.field).string.max_len = 80];
  optional string name = 4 [(buf.validate.field).string.max_len = 120];
  optional string channel = 5 [(buf.validate.field).string.max_len = 40];
  optional int32 status = 6;
}

message ListNotificationProvidersResponse {
  repeated NotificationProvider items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message SetDefaultNotificationProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message SetDefaultNotificationProviderResponse {
  NotificationProvider provider = 1;
}

message TestNotificationProviderRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional string phone = 2 [(buf.validate.field).string.max_len = 20];
}

message TestNotificationProviderResponse {
  bool healthy = 1;
  string message = 2;
}
