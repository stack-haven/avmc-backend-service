syntax = "proto3";

package platform.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/platform/service/v1;v1";

service AsyncTaskService {
  rpc ListAsyncTasks(ListAsyncTasksRequest) returns (ListAsyncTasksResponse) {
    option (google.api.http) = {get: "/platform/v1/async-tasks"};
  }

  rpc GetAsyncTaskStats(GetAsyncTaskStatsRequest) returns (GetAsyncTaskStatsResponse) {
    option (google.api.http) = {get: "/platform/v1/async-tasks:stats"};
  }

  rpc GetAsyncTask(GetAsyncTaskRequest) returns (GetAsyncTaskResponse) {
    option (google.api.http) = {get: "/platform/v1/async-tasks/{id}"};
  }

  rpc CancelAsyncTask(CancelAsyncTaskRequest) returns (CancelAsyncTaskResponse) {
    option (google.api.http) = {post: "/platform/v1/async-tasks/{id}:cancel" body: "*"};
  }

  rpc RetryAsyncTask(RetryAsyncTaskRequest) returns (RetryAsyncTaskResponse) {
    option (google.api.http) = {post: "/platform/v1/async-tasks/{id}:retry" body: "*"};
  }
}

enum AsyncTaskStatus {
  ASYNC_TASK_STATUS_UNSPECIFIED = 0;
  ASYNC_TASK_STATUS_PENDING = 1;
  ASYNC_TASK_STATUS_RUNNING = 2;
  ASYNC_TASK_STATUS_SUCCEEDED = 3;
  ASYNC_TASK_STATUS_FAILED = 4;
  ASYNC_TASK_STATUS_CANCELED = 5;
}

enum AsyncTaskHealthStatus {
  ASYNC_TASK_HEALTH_STATUS_UNSPECIFIED = 0;
  ASYNC_TASK_HEALTH_STATUS_HEALTHY = 1;
  ASYNC_TASK_HEALTH_STATUS_WARNING = 2;
  ASYNC_TASK_HEALTH_STATUS_CRITICAL = 3;
}

message AsyncTask {
  uint32 id = 1;
  optional uint32 tenant_id = 2;
  string task_type = 3;
  string queue = 4;
  AsyncTaskStatus status = 5;
  int32 priority = 6;
  int32 attempts = 7;
  int32 max_attempts = 8;
  optional string idempotency_key = 9;
  optional string payload_summary = 10;
  optional string result_summary = 11;
  optional string last_error = 12;
  optional uint32 created_by = 13;
  optional string scheduled_at = 14;
  optional string started_at = 15;
  optional string completed_at = 16;
  optional string lease_owner = 17;
  optional string lease_expires_at = 18;
  optional string created_at = 19;
  optional string updated_at = 20;
}

message ListAsyncTasksRequest {
  string page_token = 1;
  int32 page_size = 2 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];
  optional uint32 tenant_id = 3 [(buf.validate.field).uint32.gt = 0];
  optional string task_type = 4 [(buf.validate.field).string.max_len = 100];
  optional AsyncTaskStatus status = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  optional string queue = 6 [(buf.validate.field).string.max_len = 50];
}

message ListAsyncTasksResponse {
  repeated AsyncTask items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message AsyncTaskStatusCount {
  AsyncTaskStatus status = 1;
  int32 count = 2;
}

message AsyncTaskStats {
  repeated AsyncTaskStatusCount status_counts = 1;
  int32 total = 2;
  int32 pending_overdue = 3;
  int32 running_lease_expired = 4;
  int32 failed = 5;
  int32 retry_pressure = 6;
  optional string checked_at = 7;
  AsyncTaskHealthStatus health_status = 8;
  repeated AsyncTaskHealthAlert alerts = 9;
}

message AsyncTaskHealthAlert {
  string code = 1;
  AsyncTaskHealthStatus status = 2;
  int32 count = 3;
}

message GetAsyncTaskStatsRequest {
  optional string queue = 1 [(buf.validate.field).string.max_len = 50];
  int32 pending_overdue_seconds = 2 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 86400
    }
  ];
}

message GetAsyncTaskStatsResponse {
  AsyncTaskStats stats = 1;
}

message GetAsyncTaskRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message GetAsyncTaskResponse {
  AsyncTask task = 1;
}

message CancelAsyncTaskRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message CancelAsyncTaskResponse {}

message RetryAsyncTaskRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message RetryAsyncTaskResponse {
  AsyncTask task = 1;
}
