syntax = "proto3";

package platform.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "gnostic/openapi/v3/annotations.proto";

option go_package = "backend-service/api/platform/service/v1;v1";
option java_multiple_files = true;
option java_package = "platform.service.v1";

service FileCenterService {
  rpc CreateFileUploadSession(CreateFileUploadSessionRequest) returns (CreateFileUploadSessionResponse) {
    option (google.api.http) = {
      post: "/platform/v1/files/upload-sessions"
      body: "*"
    };
  }
  rpc UploadFileContent(UploadFileContentRequest) returns (UploadFileContentResponse) {
    option (google.api.http) = {
      post: "/platform/v1/files/{id}:content"
      body: "*"
    };
  }
  rpc ConfirmFileUpload(ConfirmFileUploadRequest) returns (ConfirmFileUploadResponse) {
    option (google.api.http) = {
      post: "/platform/v1/files/{id}:confirm"
      body: "*"
    };
  }
  rpc GetFileObject(GetFileObjectRequest) returns (FileObject) {
    option (google.api.http) = {get: "/platform/v1/files/{id}"};
  }
  rpc ListFileObjects(ListFileObjectsRequest) returns (ListFileObjectsResponse) {
    option (google.api.http) = {get: "/platform/v1/files"};
  }
  rpc ListFileAccessLogs(ListFileAccessLogsRequest) returns (ListFileAccessLogsResponse) {
    option (google.api.http) = {get: "/platform/v1/files/{file_id}/access-logs"};
  }
  rpc PresignFileDownload(PresignFileDownloadRequest) returns (PresignFileDownloadResponse) {
    option (google.api.http) = {get: "/platform/v1/files/{id}:download-url"};
  }
  rpc DeleteFileObject(DeleteFileObjectRequest) returns (DeleteFileObjectResponse) {
    option (google.api.http) = {delete: "/platform/v1/files/{id}"};
  }
  rpc UpdateFileObject(UpdateFileObjectRequest) returns (UpdateFileObjectResponse) {
    option (google.api.http) = {
      put: "/platform/v1/files/{id}"
      body: "*"
    };
  }
  rpc ReplaceFileContent(ReplaceFileContentRequest) returns (ReplaceFileContentResponse) {
    option (google.api.http) = {
      post: "/platform/v1/files/{id}:replace"
      body: "*"
    };
  }
  rpc DownloadFileContent(DownloadFileContentRequest) returns (DownloadFileContentResponse) {
    option (google.api.http) = {get: "/platform/v1/files/{id}:download"};
  }
  rpc UploadFilePart(UploadFilePartRequest) returns (UploadFilePartResponse) {
    option (google.api.http) = {
      put: "/platform/v1/files/{id}/parts"
      body: "*"
    };
  }
  rpc ListFileParts(ListFilePartsRequest) returns (ListFilePartsResponse) {
    option (google.api.http) = {get: "/platform/v1/files/{id}/parts"};
  }
  rpc CompleteFileUpload(CompleteFileUploadRequest) returns (CompleteFileUploadResponse) {
    option (google.api.http) = {
      post: "/platform/v1/files/{id}:complete"
      body: "*"
    };
  }
  rpc AbortFileUpload(AbortFileUploadRequest) returns (AbortFileUploadResponse) {
    option (google.api.http) = {
      post: "/platform/v1/files/{id}:abort"
      body: "*"
    };
  }
}


message FileObject {
  uint32 id = 1;
  optional uint32 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}];
  optional string file_name = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    },
    (gnostic.openapi.v3.property) = {description: "原始文件名"}
  ];
  optional string content_type = 4 [
    (buf.validate.field).string.max_len = 120,
    (gnostic.openapi.v3.property) = {description: "文件 MIME 类型"}
  ];
  optional int64 size = 5 [
    (buf.validate.field).int64.gte = 0,
    (gnostic.openapi.v3.property) = {description: "文件大小，单位字节"}
  ];
  optional string sha256 = 6 [
    (buf.validate.field).string.max_len = 64,
    (gnostic.openapi.v3.property) = {description: "文件 SHA256"}
  ];
  optional string provider = 7 [(gnostic.openapi.v3.property) = {description: "存储渠道"}];
  optional string bucket = 8 [(gnostic.openapi.v3.property) = {description: "存储桶"}];
  optional string object_key = 9 [(gnostic.openapi.v3.property) = {description: "对象 Key"}];
  optional string business_type = 10 [(gnostic.openapi.v3.property) = {description: "业务类型"}];
  optional string business_id = 11 [(gnostic.openapi.v3.property) = {description: "业务ID"}];
  optional string visibility = 12 [(gnostic.openapi.v3.property) = {description: "可见性 private/public"}];
  optional int32 status = 13 [(gnostic.openapi.v3.property) = {description: "状态 1 待确认 2 已确认 3 已删除"}];
  optional uint32 created_by = 14 [(gnostic.openapi.v3.property) = {description: "创建人ID"}];
  optional string created_at = 15 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional string updated_at = 16 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional string deleted_at = 17 [(gnostic.openapi.v3.property) = {description: "删除时间"}];
  optional string upload_expires_at = 18 [(gnostic.openapi.v3.property) = {description: "上传凭证过期时间"}];
  optional uint32 provider_id = 19 [(gnostic.openapi.v3.property) = {description: "存储渠道ID"}];
  optional string provider_code = 20 [(gnostic.openapi.v3.property) = {description: "存储渠道编码"}];
  optional string upload_id = 21 [(gnostic.openapi.v3.property) = {description: "分片上传会话ID"}];
  optional int64 part_size = 22 [(gnostic.openapi.v3.property) = {description: "分片大小（字节），0 表示非分片"}];
  optional int32 total_parts = 23 [(gnostic.openapi.v3.property) = {description: "总分片数"}];
}

message FileAccessLog {
  uint32 id = 1;
  optional uint32 tenant_id = 2 [(gnostic.openapi.v3.property) = {description: "租户ID"}];
  uint32 file_id = 3 [(gnostic.openapi.v3.property) = {description: "文件ID"}];
  optional string file_name = 4 [(gnostic.openapi.v3.property) = {description: "文件名快照"}];
  optional string action = 5 [(gnostic.openapi.v3.property) = {description: "访问动作：download/delete/preview"}];
  optional uint32 operator_id = 6 [(gnostic.openapi.v3.property) = {description: "操作人ID"}];
  optional string operator_name = 7 [(gnostic.openapi.v3.property) = {description: "操作人名称"}];
  optional string client_ip = 8 [(gnostic.openapi.v3.property) = {description: "客户端IP"}];
  optional string user_agent = 9 [(gnostic.openapi.v3.property) = {description: "User-Agent"}];
  optional string result = 10 [(gnostic.openapi.v3.property) = {description: "结果：success/failure"}];
  optional string message = 11 [(gnostic.openapi.v3.property) = {description: "结果说明"}];
  optional string created_at = 12 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
}

message CreateFileUploadSessionRequest {
  optional string file_name = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    },
    (gnostic.openapi.v3.property) = {description: "原始文件名"}
  ];
  optional string content_type = 2 [(buf.validate.field).string.max_len = 120];
  optional int64 size = 3 [(buf.validate.field).int64.gte = 0];
  optional string sha256 = 4 [(buf.validate.field).string.max_len = 64];
  optional string business_type = 5 [(buf.validate.field).string.max_len = 80];
  optional string business_id = 6 [(buf.validate.field).string.max_len = 120];
  optional string visibility = 7 [(buf.validate.field).string.max_len = 20];
  optional string idempotency_key = 8 [(buf.validate.field).string.max_len = 120];
  optional int64 part_size = 9 [
    (buf.validate.field).int64.gte = 0,
    (gnostic.openapi.v3.property) = {description: "分片大小（字节），>0 表示分片上传模式"}
  ];
  optional int32 total_parts = 10 [
    (buf.validate.field).int32.gte = 0,
    (gnostic.openapi.v3.property) = {description: "总分片数（分片模式必填）"}
  ];
}

message CreateFileUploadSessionResponse {
  FileObject file = 1;
  string upload_url = 2;
  string upload_method = 3;
  string expires_at = 4;
}

message UploadFileContentRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  bytes content = 2 [(gnostic.openapi.v3.property) = {description: "文件内容"}];
  optional string content_type = 3 [(buf.validate.field).string.max_len = 120];
  optional string sha256 = 4 [(buf.validate.field).string.max_len = 64];
}

message UploadFileContentResponse {
  FileObject file = 1;
}

message ConfirmFileUploadRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional int64 size = 2 [(buf.validate.field).int64.gte = 0];
  optional string sha256 = 3 [(buf.validate.field).string.max_len = 64];
  optional string etag = 4 [(buf.validate.field).string.max_len = 120];
}

message ConfirmFileUploadResponse {
  FileObject file = 1;
}

message GetFileObjectRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message ListFileObjectsRequest {
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 10}
    }
  ];
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  optional string file_name = 4 [(buf.validate.field).string.max_len = 255];
  optional string business_type = 5 [(buf.validate.field).string.max_len = 80];
  optional string business_id = 6 [(buf.validate.field).string.max_len = 120];
  optional int32 status = 7;
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}];
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

message ListFileObjectsResponse {
  repeated FileObject items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message ListFileAccessLogsRequest {
  string page_token = 1 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  int32 page_size = 2 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 10}
    }
  ];
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  uint32 file_id = 4 [(gnostic.openapi.v3.property) = {description: "文件ID"}];
  optional string action = 5 [(buf.validate.field).string.max_len = 40];
  optional string result = 6 [(buf.validate.field).string.max_len = 40];
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}];
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

message ListFileAccessLogsResponse {
  repeated FileAccessLog items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message PresignFileDownloadRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional int32 expires_seconds = 2 [(buf.validate.field).int32.gte = 0];
}

message PresignFileDownloadResponse {
  string download_url = 1;
  string expires_at = 2;
}

message DeleteFileObjectRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  optional string idempotency_key = 2 [(buf.validate.field).string.max_len = 120];
}

message DeleteFileObjectResponse {}

// 更新文件元数据（目前仅支持修改显示文件名）
message UpdateFileObjectRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  string file_name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    },
    (gnostic.openapi.v3.property) = {description: "新的显示文件名"}
  ];
}

message UpdateFileObjectResponse {
  FileObject file = 1;
}

// 原地替换文件内容（保留文件 ID，替换二进制对象和元数据）
message ReplaceFileContentRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  bytes content = 2 [(gnostic.openapi.v3.property) = {description: "新文件内容"}];
  optional string file_name = 3 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    },
    (gnostic.openapi.v3.property) = {description: "可选：同时更新显示文件名"}
  ];
  optional string content_type = 4 [(buf.validate.field).string.max_len = 120];
}

message ReplaceFileContentResponse {
  FileObject file = 1;
}

// 下载文件内容（后端代理读取，仅本地存储渠道支持）
message DownloadFileContentRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message DownloadFileContentResponse {
  bytes content = 1;
  string content_type = 2;
  string file_name = 3;
}

// 上传单个分片（分片上传模式）。
// 本地渠道后端代理接收分片；对象存储渠道预留为预签名分片直传。
message UploadFilePartRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  int32 part_number = 2 [
    (buf.validate.field).int32.gte = 1,
    (gnostic.openapi.v3.property) = {description: "分片序号，从 1 开始"}
  ];
  bytes content = 3 [(gnostic.openapi.v3.property) = {description: "分片内容"}];
  optional string content_sha256 = 4 [
    (buf.validate.field).string.max_len = 64,
    (gnostic.openapi.v3.property) = {description: "分片 SHA256（可选校验）"}
  ];
}

message UploadFilePartResponse {
  string etag = 1 [(gnostic.openapi.v3.property) = {description: "分片标识"}];
  int32 part_number = 2;
}

// 完成分片上传：本地渠道合并分片，对象存储渠道预留为 CompleteMultipartUpload。
message FilePart {
  int32 part_number = 1 [(buf.validate.field).int32.gte = 1];
  string etag = 2 [(buf.validate.field).string.max_len = 128];
}

// 查询已上传分片（断点续传）。
// 本地渠道扫描临时目录；对象存储预留为原生 ListParts。
message ListFilePartsRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message ListFilePartsResponse {
  repeated FilePart parts = 1;
  int32 total_parts = 2;
  int64 part_size = 3;
}

message CompleteFileUploadRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  repeated FilePart parts = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (gnostic.openapi.v3.property) = {description: "已上传分片列表（校验完整性）"}
  ];
}

message CompleteFileUploadResponse {
  FileObject file = 1;
}

// 取消分片上传，清理已上传的分片。
message AbortFileUploadRequest {
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}

message AbortFileUploadResponse {}
