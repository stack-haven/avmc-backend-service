syntax = "proto3";

package ai.service.v1;

import "buf/validate/validate.proto";
import "common/enum/enum.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

option go_package = "backend-service/api/ai/service/v1;v1";

// 对话管理服务
service ChatService {
  // 获取对话简单列表
  rpc ListChatsSimple(ListChatsRequest) returns (ListChatsResponse) {
    option (google.api.http) = {get: "/ai/v1/ai/chats/simple"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取对话简单列表"
      description: "获取对话简单列表"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
  // 获取对话列表分页
  rpc ListChats(ListChatsRequest) returns (ListChatsResponse) {
    option (google.api.http) = {get: "/ai/v1/ai/chats"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取对话列表分页"
      description: "获取对话列表分页"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 获取对话数据
  rpc GetChat(GetChatRequest) returns (Chat) {
    option (google.api.http) = {get: "/ai/v1/ai/chats/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "获取对话数据"
      description: "获取对话数据"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 创建对话
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse) {
    option (google.api.http) = {
      post: "/ai/v1/ai/chats"
      body: "chat"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建对话"
      description: "创建对话"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新对话
  rpc UpdateChat(UpdateChatRequest) returns (UpdateChatResponse) {
    option (google.api.http) = {
      put: "/ai/v1/ai/chats/{id}"
      body: "chat"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新对话"
      description: "更新对话"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 删除对话
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse) {
    option (google.api.http) = {delete: "/ai/v1/ai/chats/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除对话"
      description: "删除对话"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 更新对话状态
  rpc UpdateChatByStatus(UpdateChatByStatusRequest) returns (UpdateChatByStatusResponse) {
    option (google.api.http) = {
      put: "/ai/v1/ai/chats/status-update/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新对话状态"
      description: "更新对话状态"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }

  // 流式对话
  rpc StreamChat(StreamChatRequest) returns (StreamChatResponse) {
    option (google.api.http) = {
      post: "/ai/v1/ai/chats/stream"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "流式对话"
      description: "流式对话"
      tags: ["对话管理服务"]
      security: [
        {
          additional_properties: [
            {
              name: "BearerAuth"
              value: {}
            }
          ]
        }
      ]
    };
  }
}

message Chat {
  uint32 id = 1 [(gnostic.openapi.v3.property) = {description: "对话ID"}];
  optional string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 20
    },
    (gnostic.openapi.v3.property) = {description: "对话名"}
  ];
  optional enum.Status status = 11 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "状态 0 未知 1 启用 2 禁用"}
  ];
  optional string created_at = 12 [(gnostic.openapi.v3.property) = {description: "创建时间"}];
  optional string updated_at = 13 [(gnostic.openapi.v3.property) = {description: "更新时间"}];
  optional string description = 14 [(gnostic.openapi.v3.property) = {description: "个人说明"}]; // 个人说明
}

message CreateChatRequest {
  Chat chat = 1 [
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "对话信息"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}
message CreateChatResponse {}

message UpdateChatRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "对话ID"}
  ];
  Chat chat = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true,
    (gnostic.openapi.v3.property) = {description: "对话信息"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
  // Required. Mask of fields to update.
  google.protobuf.FieldMask update_mask = 4 [
    (google.api.field_behavior) = REQUIRED,
    (gnostic.openapi.v3.property) = {description: "更新字段掩码"}
  ];
}
message UpdateChatResponse {}

message DeleteChatRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "对话ID"}
  ];
  optional uint32 operator_id = 2 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}
message DeleteChatResponse {}

message GetChatRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "对话ID"}
  ];
}

message GetChatResponse {
  Chat chat = 1;
}

message ListChatsRequest {
  // 每页的行数
  int32 page_size = 1 [
    json_name = "pageSize",
    (gnostic.openapi.v3.property) = {
      description: "每一页的行数"
      default: {number: 20}
    }
  ];
  // 当前页码
  string page_token = 2 [
    json_name = "pageToken",
    (gnostic.openapi.v3.property) = {
      description: "当前页码"
      default: {number: 1}
    }
  ];
  // 是否不分页
  optional bool no_paging = 3 [
    json_name = "nopaging",
    (gnostic.openapi.v3.property) = {description: "是否不分页"}
  ];
  optional enum.Status status = 6 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "状态 0 未知 1 启用 2 禁用"}
  ];

  // Optional. The standard list filter.
  // Supported fields:
  //    * `name` (i.e. `name="John Doe"`)
  //    * `email` (i.e. `email="admin@go-kratos.dev"`)
  //    * `phone` (i.e. `phone="+1234567890"`)
  //    * `create_time` range (i.e. `timestamp>="2025-01-31T11:30:00-04:00"` where
  //    the timestamp is in RFC 3339 format)
  //
  // More detail in [AIP-160](https://google.aip.dev/160).
  optional string filter = 10 [(gnostic.openapi.v3.property) = {description: "筛选条件"}];
  // Optional. A comma-separated list of fields to order by, sorted in ascending
  // order. Use "desc" after a field name for descending. Supported fields:
  // - `create_time`
  //
  // Example: `create_time desc`.
  optional string order_by = 11 [(gnostic.openapi.v3.property) = {description: "排序字段"}]; // Number of resource to skip in the request.
  // * A request with no page token and a skip value of 30 returns a single
  //   page of results starting with the 31st result.
  // * A request with a page token corresponding to the 51st result (because the
  //   first 50 results were returned on the first page) and a skip value of 30
  //   returns a single page of results starting with the 81st result.
  int32 skip = 12 [(gnostic.openapi.v3.property) = {description: "跳过的行数"}];
}

message ListChatsResponse {
  repeated Chat items = 1;
  int32 total = 2;
  string next_page_token = 3;
}

// 更新对话状态 - 请求
message UpdateChatByStatusRequest {
  uint32 id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "对话ID"}
  ];
  optional enum.Status status = 2 [
    (buf.validate.field).enum.defined_only = true,
    (gnostic.openapi.v3.property) = {description: "状态 0 未知 1 启用 2 禁用"}
  ];
  optional uint32 operator_id = 3 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "操作人ID"}
  ];
}

// 更新对话状态 - 回应
message UpdateChatByStatusResponse {}

message StreamChatRequest {
  uint32 chat_id = 1 [
    (buf.validate.field).uint32.gt = 0,
    (gnostic.openapi.v3.property) = {description: "对话ID"}
  ];
  string message = 2 [
    (buf.validate.field).string = {min_len: 1},
    (gnostic.openapi.v3.property) = {description: "消息内容"}
  ];
}

message StreamChatResponse {
  string stream_id = 1 [(gnostic.openapi.v3.property) = {description: "流ID"}];
}
