version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
inputs:
  - directory: .
    paths:
      - ./core/service/v1
      - ./platform/admin/v1
      - ./version/service/v1
      - ./ai/service/v1
plugins:
  - local: protoc-gen-go
    out: ../api
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../api
    opt:
      - paths=source_relative
  - local: protoc-gen-go-http
    out: ../api
    opt:
      - paths=source_relative
