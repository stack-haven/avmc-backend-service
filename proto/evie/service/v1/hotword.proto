syntax = "proto3";

package evie.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/evie/service/v1;v1";

// ASR 热词管理服务。
service HotwordService {
  // 查询热词列表
  rpc ListHotwords(ListHotwordsRequest) returns (ListHotwordsResponse) {
    option (google.api.http) = {get: "/evie/v1/hotwords"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询热词列表"
      tags: ["热词管理"]
    };
  }

  // 新增或更新热词（id=0 新建，id>0 更新）
  rpc UpsertHotword(UpsertHotwordRequest) returns (UpsertHotwordResponse) {
    option (google.api.http) = {
      post: "/evie/v1/hotwords"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "新增或更新热词"
      tags: ["热词管理"]
    };
  }

  // 删除热词
  rpc DeleteHotword(DeleteHotwordRequest) returns (DeleteHotwordResponse) {
    option (google.api.http) = {delete: "/evie/v1/hotwords/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除热词"
      tags: ["热词管理"]
    };
  }
}

// Hotword 热词。
message Hotword {
  uint32 id = 1;
  string word = 2;      // 热词原文
  string target = 3;    // 期望识别结果，空=用 word
  float weight = 4;     // 权重 0-10
  string category = 5;  // person/org/product/term
  string created_at = 6;
  string updated_at = 7;
}

message ListHotwordsRequest {
  string category = 1;  // 按实体分类筛选
}

message ListHotwordsResponse {
  repeated Hotword hotwords = 1;
}

message UpsertHotwordRequest {
  uint32 id = 1;  // 0=新建，>0=更新
  string word = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string target = 3 [(buf.validate.field).string = {max_len: 64}];
  float weight = 4;
  string category = 5 [(buf.validate.field).string = {max_len: 32}];
}

message UpsertHotwordResponse {
  Hotword hotword = 1;
}

message DeleteHotwordRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message DeleteHotwordResponse {}
