syntax = "proto3";

package evie.service.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";

option go_package = "backend-service/api/evie/service/v1;v1";

// 词库中心：词库（Dictionary）与词条（DictionaryEntry）管理服务。
// 词库表示一组具有共同作用域和生命周期的语言知识集合；
// 词条表示一个标准语言概念（词或短语）。
service DictionaryService {
  // 分页查询词库列表
  rpc ListDictionaries(ListDictionariesRequest) returns (ListDictionariesResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionaries"};
    option (gnostic.openapi.v3.operation) = {
      summary: "分页查询词库列表"
      tags: ["词库中心"]
    };
  }

  // 查询词库详情
  rpc GetDictionary(GetDictionaryRequest) returns (Dictionary) {
    option (google.api.http) = {get: "/evie/v1/dictionaries/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词库详情"
      tags: ["词库中心"]
    };
  }

  // 创建词库
  rpc CreateDictionary(CreateDictionaryRequest) returns (Dictionary) {
    option (google.api.http) = {
      post: "/evie/v1/dictionaries"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建词库"
      tags: ["词库中心"]
    };
  }

  // 更新词库
  rpc UpdateDictionary(UpdateDictionaryRequest) returns (Dictionary) {
    option (google.api.http) = {
      put: "/evie/v1/dictionaries/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新词库"
      tags: ["词库中心"]
    };
  }

  // 删除词库（软删除）
  rpc DeleteDictionary(DeleteDictionaryRequest) returns (DeleteDictionaryResponse) {
    option (google.api.http) = {delete: "/evie/v1/dictionaries/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除词库"
      tags: ["词库中心"]
    };
  }

  // 分页查询词条列表
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionaries/{dictionary_id}/entries"};
    option (gnostic.openapi.v3.operation) = {
      summary: "分页查询词条列表"
      tags: ["词库中心"]
    };
  }

  // 查询词条详情
  rpc GetEntry(GetEntryRequest) returns (DictionaryEntry) {
    option (google.api.http) = {get: "/evie/v1/entries/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词条详情"
      tags: ["词库中心"]
    };
  }

  // 创建词条
  rpc CreateEntry(CreateEntryRequest) returns (DictionaryEntry) {
    option (google.api.http) = {
      post: "/evie/v1/dictionaries/{dictionary_id}/entries"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建词条"
      tags: ["词库中心"]
    };
  }

  // 更新词条
  rpc UpdateEntry(UpdateEntryRequest) returns (DictionaryEntry) {
    option (google.api.http) = {
      put: "/evie/v1/entries/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新词条"
      tags: ["词库中心"]
    };
  }

  // 删除词条（软删除）
  rpc DeleteEntry(DeleteEntryRequest) returns (DeleteEntryResponse) {
    option (google.api.http) = {delete: "/evie/v1/entries/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除词条"
      tags: ["词库中心"]
    };
  }

  // 分页查询词条关系列表
  rpc ListRelations(ListRelationsRequest) returns (ListRelationsResponse) {
    option (google.api.http) = {get: "/evie/v1/entries/{entry_id}/relations"};
    option (gnostic.openapi.v3.operation) = {
      summary: "分页查询词条关系列表"
      tags: ["词库中心"]
    };
  }

  // 查询词条关系详情
  rpc GetRelation(GetRelationRequest) returns (DictionaryRelation) {
    option (google.api.http) = {get: "/evie/v1/relations/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词条关系详情"
      tags: ["词库中心"]
    };
  }

  // 创建词条关系
  rpc CreateRelation(CreateRelationRequest) returns (DictionaryRelation) {
    option (google.api.http) = {
      post: "/evie/v1/entries/{entry_id}/relations"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建词条关系"
      tags: ["词库中心"]
    };
  }

  // 更新词条关系
  rpc UpdateRelation(UpdateRelationRequest) returns (DictionaryRelation) {
    option (google.api.http) = {
      put: "/evie/v1/relations/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新词条关系"
      tags: ["词库中心"]
    };
  }

  // 删除词条关系
  rpc DeleteRelation(DeleteRelationRequest) returns (DeleteRelationResponse) {
    option (google.api.http) = {delete: "/evie/v1/relations/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除词条关系"
      tags: ["词库中心"]
    };
  }

  // 分页查询词条分类列表
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionary-categories"};
    option (gnostic.openapi.v3.operation) = {
      summary: "分页查询词条分类列表"
      tags: ["词库中心"]
    };
  }

  // 创建词条分类（仅自定义）
  rpc CreateCategory(CreateCategoryRequest) returns (DictionaryCategory) {
    option (google.api.http) = {
      post: "/evie/v1/dictionary-categories"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "创建词条分类"
      tags: ["词库中心"]
    };
  }

  // 更新词条分类（仅自定义）
  rpc UpdateCategory(UpdateCategoryRequest) returns (DictionaryCategory) {
    option (google.api.http) = {
      put: "/evie/v1/dictionary-categories/{id}"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "更新词条分类"
      tags: ["词库中心"]
    };
  }

  // 删除词条分类（仅自定义）
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {
    option (google.api.http) = {delete: "/evie/v1/dictionary-categories/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "删除词条分类"
      tags: ["词库中心"]
    };
  }

  // 分页查询词库版本列表
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionaries/{dictionary_id}/versions"};
    option (gnostic.openapi.v3.operation) = {
      summary: "分页查询词库版本列表"
      tags: ["词库中心"]
    };
  }

  // 查询词库版本详情
  rpc GetVersion(GetVersionRequest) returns (DictionaryVersion) {
    option (google.api.http) = {get: "/evie/v1/dictionary-versions/{id}"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词库版本详情"
      tags: ["词库中心"]
    };
  }

  // 发布词库版本（生成时点快照）
  rpc PublishDictionary(PublishDictionaryRequest) returns (DictionaryVersion) {
    option (google.api.http) = {
      post: "/evie/v1/dictionaries/{dictionary_id}:publish"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "发布词库版本"
      tags: ["词库中心"]
    };
  }

  // 查询词库冲突记录
  rpc ListConflicts(ListConflictsRequest) returns (ListConflictsResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionary-conflicts"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词库冲突记录"
      tags: ["词库中心"]
    };
  }

  // 查询词库统计指标（词库详情页顶部 + 工作台健康度聚合）。
  rpc GetDictionaryStats(GetDictionaryStatsRequest) returns (GetDictionaryStatsResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionaries/{dictionary_id}:stats"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词库统计指标"
      tags: ["词库中心"]
    };
  }

  // 词库级别关系列表（不需先选 entryId，一次性返回词库下所有词条的关系）。
  rpc ListRelationsByDictionary(ListRelationsByDictionaryRequest) returns (ListRelationsByDictionaryResponse) {
    option (google.api.http) = {get: "/evie/v1/dictionaries/{dictionary_id}/relations"};
    option (gnostic.openapi.v3.operation) = {
      summary: "词库级别关系列表"
      tags: ["词库中心"]
    };
  }

  // 查询词库中心工作台总览（我的词库 + 系统词库 + 全局事件 + 健康度聚合）。
  rpc GetDashboardOverview(GetDashboardOverviewRequest) returns (GetDashboardOverviewResponse) {
    option (google.api.http) = {get: "/evie/v1/dashboard"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词库中心工作台总览"
      tags: ["词库中心"]
    };
  }

  // 查询词库健康度指标（基于增强记录 + ASR 记录的识别命中聚合）。
  rpc GetVocabularyHealth(GetVocabularyHealthRequest) returns (GetVocabularyHealthResponse) {
    option (google.api.http) = {get: "/evie/v1/vocabulary-health"};
    option (gnostic.openapi.v3.operation) = {
      summary: "查询词库健康度指标"
      tags: ["词库中心"]
    };
  }
}

// Dictionary 词库。
message Dictionary {
  uint32 id = 1;
  string name = 2;        // 词库名称
  string scope = 3;       // 作用域: PLATFORM/SYSTEM/TENANT
  string source = 4;      // 来源: PLATFORM/SYSTEM/MANUAL/IMPORT/SYNC/API
  string description = 5; // 描述
  int32 status = 6;       // 状态: 1=启用 2=禁用
  string created_at = 7;
  string updated_at = 8;
}

// DictionaryEntry 词条（标准语言概念，词或短语）。
message DictionaryEntry {
  uint32 id = 1;
  uint32 dictionary_id = 2; // 所属词库 ID
  string standard_text = 3; // 标准词/短语
  string entry_type = 4;    // 词条类型: WORD/PHRASE
  string category = 5;      // 分类: PERSON/ORGANIZATION/PRODUCT/...
  string description = 6;
  string source = 7;        // 来源
  string source_id = 8;     // 外部来源 ID
  int32 priority = 9;       // 匹配优先级
  string pinyin = 10;       // 全拼
  string pinyin_initial = 11; // 拼音首字母
  string normalized_text = 12; // 规范化文本
  int32 status = 13;        // 状态: 1=启用 2=禁用
  string created_at = 14;
  string updated_at = 15;
}

message ListDictionariesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string scope = 3;   // 按作用域筛选
  string keyword = 4; // 按名称模糊搜索
  int32 status = 5;   // 按状态筛选
}

message ListDictionariesResponse {
  repeated Dictionary dictionaries = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetDictionaryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message CreateDictionaryRequest {
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string scope = 2 [(buf.validate.field).string = {max_len: 32}];
  string source = 3 [(buf.validate.field).string = {max_len: 32}];
  string description = 4 [(buf.validate.field).string = {max_len: 512}];
}

message UpdateDictionaryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string name = 2 [(buf.validate.field).string = {max_len: 128}];
  string description = 3 [(buf.validate.field).string = {max_len: 512}];
  int32 status = 4;
}

message DeleteDictionaryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message DeleteDictionaryResponse {}

message ListEntriesRequest {
  uint32 dictionary_id = 1; // 0=全部词库
  int32 page_size = 2;
  string page_token = 3;
  string category = 4;   // 按分类筛选
  string keyword = 5;     // 按标准词模糊搜索
  int32 status = 6;       // 按状态筛选
}

message ListEntriesResponse {
  repeated DictionaryEntry entries = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetEntryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message CreateEntryRequest {
  uint32 dictionary_id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string standard_text = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  string entry_type = 3 [(buf.validate.field).string = {max_len: 16}];
  string category = 4 [(buf.validate.field).string = {max_len: 64}];
  string description = 5 [(buf.validate.field).string = {max_len: 512}];
  string source = 6 [(buf.validate.field).string = {max_len: 32}];
  string source_id = 7 [(buf.validate.field).string = {max_len: 128}];
  int32 priority = 8;
  string pinyin = 9 [(buf.validate.field).string = {max_len: 512}];
  string pinyin_initial = 10 [(buf.validate.field).string = {max_len: 128}];
  string normalized_text = 11 [(buf.validate.field).string = {max_len: 255}];
}

message UpdateEntryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string standard_text = 2 [(buf.validate.field).string = {max_len: 255}];
  string entry_type = 3 [(buf.validate.field).string = {max_len: 16}];
  string category = 4 [(buf.validate.field).string = {max_len: 64}];
  string description = 5 [(buf.validate.field).string = {max_len: 512}];
  int32 priority = 6;
  string pinyin = 7 [(buf.validate.field).string = {max_len: 512}];
  string pinyin_initial = 8 [(buf.validate.field).string = {max_len: 128}];
  string normalized_text = 9 [(buf.validate.field).string = {max_len: 255}];
  int32 status = 10;
}

message DeleteEntryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message DeleteEntryResponse {}

// DictionaryRelation 词条关系（别名/纠错/同音/近音/简称/相关）。
message DictionaryRelation {
  uint32 id = 1;
  uint32 entry_id = 2;       // 所属词条 ID
  string relation_type = 3;  // 关系类型: ALIAS/CORRECTION/HOMOPHONE/PHONETIC_SIMILAR/ABBREVIATION/RELATED
  string related_text = 4;   // 关联表达（如别名「小田」、错误表达「金种子」）
  uint32 target_entry_id = 5; // 目标词条 ID（可选）
  string source = 6;         // 来源: MANUAL/SYNC/IMPORT/API
  string description = 7;
  int32 status = 8;          // 状态: 1=启用 2=禁用
  string created_at = 9;
  string updated_at = 10;

  // —— 以下字段为词库中心交互优化补全（2026-08-25），用于关系表格自然语言化展示。
  // —— biz 层在返回前已 JOIN dictionary_entries 与 dictionary 表。
  // —— proto3 新增字段不影响 wire 兼容性，老客户端会安全忽略。
  string entry_standard_text = 11;   // 所属词条的标准词/短语（用于展示「您 → ALIAS → 客服您好」）
  string entry_category = 12;        // 所属词条的分类（PERSON/ORGANIZATION/PRODUCT/...）
  string dictionary_name = 13;       // 所属词库名（跨词库聚合时显示，避免纯 ID）
  string related_standard_text = 14; // 关联目标的标准词（同义词关系时填 target_entry 的 standard_text）
  uint32 related_tenant_id = 15;     // 关联目标所在租户（跨租户场景，用于权限判断与 UI 徽章）
}

message ListRelationsRequest {
  uint32 entry_id = 1; // 0=全部词条
  int32 page_size = 2;
  string page_token = 3;
  string relation_type = 4; // 按关系类型筛选
}

message ListRelationsResponse {
  repeated DictionaryRelation relations = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetRelationRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message CreateRelationRequest {
  uint32 entry_id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string relation_type = 2 [(buf.validate.field).string = {min_len: 1, max_len: 32}];
  string related_text = 3 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
  uint32 target_entry_id = 4;
  string source = 5 [(buf.validate.field).string = {max_len: 32}];
  string description = 6 [(buf.validate.field).string = {max_len: 512}];
}

message UpdateRelationRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string relation_type = 2 [(buf.validate.field).string = {max_len: 32}];
  string related_text = 3 [(buf.validate.field).string = {max_len: 255}];
  uint32 target_entry_id = 4;
  string description = 5 [(buf.validate.field).string = {max_len: 512}];
  int32 status = 6;
}

message DeleteRelationRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message DeleteRelationResponse {}

// DictionaryCategory 词条分类（性质）。内置分类只读，自定义分类租户可管理。
message DictionaryCategory {
  uint32 id = 1;
  string code = 2;  // 分类编码: PERSON/ORGANIZATION/PRODUCT/...
  string name = 3;  // 分类名称
  bool builtin = 4; // 是否内置分类
  int32 sort = 5;
  int32 status = 6;
  string created_at = 7;
  string updated_at = 8;
}

// DictionaryVersion 词库版本（时点快照）。
message DictionaryVersion {
  uint32 id = 1;
  uint32 dictionary_id = 2;
  int32 version_no = 3;  // 版本号，递增
  string snapshot = 4;   // 词条/关系时点快照（JSON）
  string description = 5;
  int32 status = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListCategoriesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string keyword = 3; // 按名称/编码模糊搜索
}

message ListCategoriesResponse {
  repeated DictionaryCategory categories = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message CreateCategoryRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  int32 sort = 3;
}

message UpdateCategoryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string name = 2 [(buf.validate.field).string = {max_len: 128}];
  int32 sort = 3;
  int32 status = 4;
}

message DeleteCategoryRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message DeleteCategoryResponse {}

message ListVersionsRequest {
  uint32 dictionary_id = 1; // 0=全部词库
  int32 page_size = 2;
  string page_token = 3;
}

message ListVersionsResponse {
  repeated DictionaryVersion versions = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message GetVersionRequest {
  uint32 id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message PublishDictionaryRequest {
  uint32 dictionary_id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  string description = 2 [(buf.validate.field).string = {max_len: 512}];
}

// DictionaryConflict 词库冲突记录。
message DictionaryConflict {
  uint32 id = 1;
  string input = 2;               // 输入表达
  string candidate = 3;           // 候选结果
  string source_scope = 4;        // 来源作用域: PLATFORM/SYSTEM/TENANT
  string source_dictionary = 5;   // 来源词库标识
  int32 priority = 6;             // 候选优先级
  string resolved_candidate = 7;  // 解析后的候选
  string created_at = 8;
}

message ListConflictsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListConflictsResponse {
  repeated DictionaryConflict conflicts = 1;
  int32 total = 2;
  string next_page_token = 3;
}

// ===== 词库中心交互优化 P0 接口（2026-08-25） =====

// DictionaryStats 词库统计指标。
message DictionaryStats {
  uint32 dictionary_id = 1;

  // 基础计数
  int32 entry_count = 2;                 // 词条总数（含已禁用）
  int32 enabled_entry_count = 3;         // 启用词条数
  int32 relation_count = 4;              // 关系总数
  int32 version_count = 5;               // 已发布版本数
  int32 unresolved_conflict_count = 6;   // 未解决冲突数（status=PENDING）

  // 健康度（基于近 7 天 EnhancementLog + AsrRecord 聚合）
  double hit_rate = 7;                   // 词库命中率（命中词条 / 总请求）
  double avg_recognition_confidence = 8; // 平均识别置信度（来自关联的 AsrRecord）

  // 时间戳
  string last_modified_at = 20;          // 最近一次词条/关系变更时间
}

message GetDictionaryStatsRequest {
  uint32 dictionary_id = 1 [(buf.validate.field).uint32 = {gt: 0}];
}

message GetDictionaryStatsResponse {
  DictionaryStats stats = 1;
}

// ListRelationsByDictionaryRequest 词库级别关系列表请求。
// 与 ListRelations 的区别：不需先选 entryId，一次性返回词库下所有词条的关系。
message ListRelationsByDictionaryRequest {
  uint32 dictionary_id = 1 [(buf.validate.field).uint32 = {gt: 0}];
  int32 page_size = 2;
  string page_token = 3;
  string relation_type = 4; // 可选筛选
  string keyword = 5;       // 可选筛选（匹配 entry.standard_text 或 relation.related_text）
}

message ListRelationsByDictionaryResponse {
  repeated DictionaryRelation relations = 1; // DictionaryRelation 已补全 entry_standard_text 等字段
  int32 total = 2;
  string next_page_token = 3;
}

// ===== 词库中心交互优化 Backend-1 接口（2026-08-25） =====

// DashboardMyDictionary 工作台「我的词库」轻量卡片（仅展示必要字段）。
message DashboardMyDictionary {
  uint32 id = 1;
  string name = 2;
  string scope = 3;            // TENANT
  int32 entry_count = 4;       // 词库下词条总数
  int32 relation_count = 5;     // 词库下关系总数
  int32 unresolved_conflict_count = 6; // 未解决冲突数
  string last_modified_at = 7;
}

// DashboardSystemDictionary 工作台「系统词库」轻量卡片（PLATFORM/SYSTEM scope）。
message DashboardSystemDictionary {
  uint32 id = 1;
  string name = 2;
  string scope = 3;            // PLATFORM / SYSTEM
  int32 entry_count = 4;
  string last_modified_at = 7;
}

// DashboardActivity 工作台全局事件项（聚合 DictionaryChangeLog + 增强记录 + 冲突）。
message DashboardActivity {
  uint64 id = 1;
  string type = 2;             // dictionary.published / dictionary.entry.created / conflict.detected / enhancement.recorded
  string title = 3;             // 人友可读事件标题，如「发布了词库『客服话术』v1.3」
  string summary = 4;          // 事件详细描述（词条文本/错误原因等）
  uint32 actor_id = 5;          // 触发者 ID
  string actor_name = 6;       // 触发者名称（如有）
  string target_type = 7;       // dictionary / entry / relation / conflict
  uint32 target_id = 8;        // 目标资源 ID
  string target_label = 9;     // 目标名称（如词库名）
  string scope = 10;           // PLATFORM / SYSTEM / TENANT（用于决定是否跨租户可见）
  string created_at = 11;
}

// DashboardHealthSummary 工作台健康度聚合（覆盖当前租户 + PLATFORM scope 词库）。
message DashboardHealthSummary {
  int32 total_dictionaries = 1;
  int32 total_entries = 2;
  int32 enabled_entries = 3;
  int32 total_relations = 4;
  int32 unresolved_conflicts = 5;
  double hit_rate = 6;                  // 近 7 天识别命中词条比例（0~1）
  double avg_recognition_confidence = 7;// 近 7 天识别置信度均值（0~1）
  int32 coverage_dictionary_count = 8;  // 覆盖识别的词库数（hit_rate > 0）
  int32 total_dictionary_count = 9;    // 总词库数
}

// DashboardOverview 工作台总览响应。
message DashboardOverview {
  repeated DashboardMyDictionary my_dictionaries = 1;       // scope=TENANT 的可见词库
  repeated DashboardSystemDictionary system_dictionaries = 2; // scope=PLATFORM/SYSTEM 可见词库
  DashboardHealthSummary health = 3;
  repeated DashboardActivity recent_activities = 4;          // 近 5 条全局事件
}

message GetDashboardOverviewRequest {
  string activities_limit = 1; // 可选："5"/"10"/"20"，默认 5
}

message GetDashboardOverviewResponse {
  DashboardOverview overview = 1;
}

// VocabularyHealthDetail 词库健康度详细指标。
message VocabularyHealthDetail {
  uint32 dictionary_id = 1;
  string dictionary_name = 2;
  int32 entry_count = 3;
  int32 relation_count = 4;
  double hit_rate = 5;
  double avg_recognition_confidence = 6;
  int32 sample_count = 7; // 计算所用的增强记录样本数
}

message GetVocabularyHealthRequest {
  string dictionary_scope = 1; // 可选："ALL"/"PLATFORM"/"TENANT"，默认 ALL
  int32 recent_days = 2;       // 近 N 天的增强记录，默认 7
}

message GetVocabularyHealthResponse {
  repeated VocabularyHealthDetail details = 1;
}
